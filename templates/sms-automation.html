<div class="content">
    <div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
        <div class="d-flex flex-column">
            <div class="breadcrumb-title">SMS Automation</div>
            <nav aria-label="breadcrumb" class="mt-1">
                <ol class="breadcrumb mb-0 p-0"></ol>
            </nav>
        </div>
        <div class="ms-auto ms-md-0">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#autoModal"><i class="bx bx-plus"></i> Add Rule</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Event</th>
                            <th>Template</th>
                            <th>Delay</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="autoTableBody">
                        <tr><td colspan="6" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="autoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Automation Rule</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="autoForm">
                <div class="modal-body">
                    <input type="hidden" id="autoId" />
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="autoName" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Trigger Event</label>
                        <select class="form-select" id="autoEvent" required>
                            <option value="">-- Select Event --</option>
                            <option value="booking.confirmed">Booking Confirmed</option>
                            <option value="booking.checkin">Check-in</option>
                            <option value="booking.checkout">Check-out</option>
                            <option value="booking.cancelled">Booking Cancelled</option>
                            <option value="payment.received">Payment Received</option>
                            <option value="order.placed">Order Placed</option>
                            <option value="customer.birthday">Customer Birthday</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">SMS Template</label>
                        <select class="form-select" id="autoTemplate" required>
                            <option value="">-- Select Template --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Delay (minutes)</label>
                        <input type="number" class="form-control" id="autoDelay" min="0" value="0" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="autoStatus">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="autoDescription" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    loadRules();
    loadTemplates();
    setupForm();
});

function loadRules() {
    $.ajax({
        url: 'api/sms/automation.php', method: 'GET', dataType: 'json',
        success: function(resp) {
            if (!resp.success || !resp.data.rules) return;
            var html = resp.data.rules.map(function(r) {
                var cls = r.status === 'Active' ? 'success' : 'secondary';
                return '<tr>' +
                    '<td>' + r.name + '</td>' +
                    '<td><code>' + r.event + '</code></td>' +
                    '<td><small>' + (r.template_uid || '-') + '</small></td>' +
                    '<td>' + r.delay_minutes + ' min</td>' +
                    '<td><span class="badge bg-' + cls + '">' + r.status + '</span></td>' +
                    '<td>' +
                        '<a href="javascript:void(0);" class="btn btn-sm btn-primary edit-rule" data-id="' + r.id + '"><i class="bx bx-edit"></i></a> ' +
                        '<a href="javascript:void(0);" class="btn btn-sm btn-danger delete-rule" data-id="' + r.id + '"><i class="bx bx-trash"></i></a>' +
                    '</td>' +
                    '</tr>';
            }).join('');
            $('#autoTableBody').html(html || '<tr><td colspan="6" class="text-center">No rules defined</td></tr>');
        }
    });
}

function loadTemplates() {
    $.ajax({
        url: 'api/sms/templates.php', method: 'GET', dataType: 'json',
        success: function(resp) {
            if (!resp.success || !resp.data.templates) return;
            var opts = '<option value="">-- Select Template --</option>' +
                resp.data.templates.map(function(t) { return '<option value="' + t.id + '">' + t.name + '</option>'; }).join('');
            $('#autoTemplate').html(opts);
        }
    });
}

function setupForm() {
    $('#autoForm').submit(function(e) {
        e.preventDefault();
        var id = $('#autoId').val();
        var data = {
            id: id,
            name: $('#autoName').val(),
            event: $('#autoEvent').val(),
            template_uid: $('#autoTemplate').val(),
            delay_minutes: parseInt($('#autoDelay').val()) || 0,
            status: $('#autoStatus').val(),
            description: $('#autoDescription').val()
        };
        $.ajax({
            url: 'api/sms/automation.php',
            method: id ? 'PUT' : 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            dataType: 'json',
            success: function(resp) {
                if (resp.success) {
                    $('#autoModal').modal('hide');
                    $('#autoForm')[0].reset();
                    $('#autoId').val('');
                    loadRules();
                } else {
                    alert('Error: ' + resp.message);
                }
            }
        });
    });

    $(document).on('click', '.edit-rule', function() {
        var id = $(this).data('id');
        $.ajax({
            url: 'api/sms/automation.php?id=' + encodeURIComponent(id),
            method: 'GET', dataType: 'json',
            success: function(resp) {
                if (resp.success && resp.data.rules && resp.data.rules.length) {
                    var r = resp.data.rules[0];
                    $('#autoId').val(r.id);
                    $('#autoName').val(r.name);
                    $('#autoEvent').val(r.event);
                    $('#autoTemplate').val(r.template_uid || '');
                    $('#autoDelay').val(r.delay_minutes || 0);
                    $('#autoStatus').val(r.status || 'Active');
                    $('#autoDescription').val(r.description || '');
                    $('#autoModal').modal('show');
                }
            }
        });
    });

    $(document).on('click', '.delete-rule', function() {
        var id = $(this).data('id');
        if (!confirm('Delete this automation rule?')) return;
        $.ajax({
            url: 'api/sms/automation.php', method: 'DELETE',
            contentType: 'application/json',
            data: JSON.stringify({id: id}),
            dataType: 'json',
            success: function(resp) { if (resp.success) loadRules(); else alert('Error: ' + resp.message); }
        });
    });

    $('#autoModal').on('hidden.bs.modal', function() {
        $('#autoForm')[0].reset();
        $('#autoId').val('');
    });
}
</script>
