<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Liabilities Manage</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0"><button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> Add Liability</button></div>
</div>

<div class="card mb-3"><div class="card-body">
    <div class="table-responsive"><table class="table table-striped align-middle">
        <thead><tr><th>ID</th><th>Date</th><th>Voucher</th><th>Asset Cat.</th><th>Type</th><th>Recorded By</th><th class="text-end">Amount</th><th class="text-end">Actions</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
    </table></div>
</div></div>

<div class="modal fade" id="vModal"><div class="modal-dialog modal-xl"><div class="modal-content">
    <div class="modal-header py-2"><h5 class="mb-0">New Liability</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="row g-2 mb-2">
            <div class="col-md-2"><label class="form-label small mb-1">Date *</label><input type="date" class="form-control form-control-sm" id="vDate"></div>
            <div class="col-md-2"><label class="form-label small mb-1">Voucher</label><input class="form-control form-control-sm" value="Auto" readonly></div>
            <div class="col-md-3"><label class="form-label small mb-1">Asset Category *</label><select class="form-select form-select-sm" id="vAsset"></select></div>
            <div class="col-md-2"><label class="form-label small mb-1">Tx Type *</label>
                <select class="form-select form-select-sm" id="vTxType">
                    <option value="receive">Receive</option>
                    <option value="pay">Pay</option>
                </select>
            </div>
            <div class="col-md-3"><label class="form-label small mb-1">Liability Category *</label><select class="form-select form-select-sm" id="vCat"></select></div>
        </div>
        <div class="row g-2 mb-2">
            <div class="col-md-3"><label class="form-label small mb-1">Payment Method</label><select class="form-select form-select-sm" id="vPm"></select></div>
            <div class="col-md-5"><label class="form-label small mb-1">Description</label><input class="form-control form-control-sm" id="vDesc"></div>
            <div class="col-md-2"><label class="form-label small mb-1">Amount *</label><input type="number" step="0.01" min="0" class="form-control form-control-sm" id="vAmt"></div>
            <div class="col-md-2"><label class="form-label small mb-1">Receipt?</label>
                <select class="form-select form-select-sm" id="vReceipt"><option value="0">No</option><option value="1">Yes</option></select>
            </div>
        </div>
        <div class="row g-2 align-items-end">
            <div class="col-md-9"><label class="form-label small mb-1">Note</label><input class="form-control form-control-sm" id="vNote"></div>
            <div class="col-md-3 text-end fw-bold">Total: ৳<span id="vTotal">0.00</span></div>
        </div>
    </div>
    <div class="modal-footer py-2"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary btn-sm" id="vSave">Submit</button></div>
</div></div></div>

<script>
window.Page = {
    init: function(){
        var self = this;
        self._loadList();
        $.when(
            $.get('api/accounts/assets-list.php'),
            $.get('api/accounts/category-list.php', { kind: 'liability' }),
            $.get('api/payment/methods-list.php', { limit: 100 })
        ).done(function(a, c, p){
            $('#vAsset').html('<option value="">--</option>' + (a[0].data.items||[]).filter(function(x){return parseInt(x.isactive,10)===1;}).map(function(x){ return '<option value="'+x.id+'">'+x.name+'</option>'; }).join(''));
            $('#vCat').html('<option value="">--</option>' + (c[0].data.items||[]).filter(function(x){return parseInt(x.isactive,10)===1;}).map(function(x){ return '<option value="'+x.id+'">'+x.name+'</option>'; }).join(''));
            $('#vPm').html('<option value="">--</option>' + ((p[0].data||{}).items||[]).map(function(x){ return '<option value="'+x.id+'">'+x.name+'</option>'; }).join(''));
        });
        $('#btnAdd').off('click.v').on('click.v', function(){ self._openAdd(); });
        $('#vAmt').off('input.v').on('input.v', function(){ $('#vTotal').text((parseFloat($(this).val())||0).toFixed(2)); });
        $('#vSave').off('click.v').on('click.v', function(){ self._save(); });
        $(document).off('click.v-del').on('click.v-del', '.v-del', function(){ if(confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function(){ $('#btnAdd,#vSave,#vAmt').off('.v'); $(document).off('click.v-del'); },
    _loadList: function(){
        $.get('api/accounts/voucher-list.php', { type: 'liability' }, function(r){
            if (!r.success) return;
            if (!r.data.items.length) { $('#tableBody').html('<tr><td colspan="8" class="text-center">No data</td></tr>'); return; }
            $('#tableBody').html(r.data.items.map(function(v){
                var tx = v.transaction_type === 'pay'
                    ? '<span class="badge bg-danger">Pay</span>'
                    : '<span class="badge bg-success">Receive</span>';
                return '<tr><td>'+v.id+'</td><td>'+v.voucher_date+'</td><td>'+v.voucher_no+'</td>' +
                       '<td>'+(v.asset_name||'-')+'</td><td>'+tx+'</td><td>'+(v.collected_by||'-')+'</td>' +
                       '<td class="text-end">৳'+parseFloat(v.total).toFixed(2)+'</td>' +
                       '<td class="text-end"><button class="btn btn-sm btn-danger v-del" data-id="'+v.id+'"><i class="bx bx-trash"></i></button></td></tr>';
            }).join(''));
        });
    },
    _openAdd: function(){
        $('#vDate').val(new Date().toISOString().slice(0,10));
        $('#vAsset').val(''); $('#vCat').val(''); $('#vPm').val(''); $('#vTxType').val('receive');
        $('#vDesc').val(''); $('#vAmt').val(''); $('#vNote').val(''); $('#vReceipt').val(0); $('#vTotal').text('0.00');
        $('#vModal').modal('show');
    },
    _save: function(){
        var self = this;
        var amt = parseFloat($('#vAmt').val()) || 0;
        if (amt <= 0) { if (window.Toast) Toast.warning('Amount > 0 required'); else alert('Amount required'); return; }
        var payload = {
            type: 'liability',
            voucher_date: $('#vDate').val(),
            asset_category_id: parseInt($('#vAsset').val(),10) || 0,
            transaction_type: $('#vTxType').val(),
            want_receipt: parseInt($('#vReceipt').val(),10),
            note: $('#vNote').val(),
            items: [{
                category_id: parseInt($('#vCat').val(),10) || 0,
                description: $('#vDesc').val(),
                payment_method_id: parseInt($('#vPm').val(),10) || 0,
                amount: amt
            }]
        };
        $.ajax({ url:'api/accounts/voucher-save.php', method:'POST', contentType:'application/json', data: JSON.stringify(payload) })
        .done(function(r){
            if (r.success) { $('#vModal').modal('hide'); self._loadList(); }
            if (window.Toast) Toast.info(r.message); else alert(r.message);
        });
    },
    _del: function(id){
        var self = this;
        $.ajax({ url:'api/accounts/voucher-delete.php', method:'POST', contentType:'application/json', data: JSON.stringify({id:id}) })
        .done(function(r){ if (r.success) self._loadList(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
