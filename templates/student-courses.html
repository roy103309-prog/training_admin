<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Course Setup</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-primary d-none" id="btnAdd"><i class="bx bx-plus"></i> Add Course</button>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="row mb-3">
        <div class="col-md-4"><input type="text" class="form-control" id="searchInput" placeholder="Search courses..."></div>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>#</th><th>Category</th><th>Course Name</th><th class="text-end">Fee</th><th>Duration</th><th>Students</th><th>Sort</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="9" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<div class="modal fade" id="courseModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 id="courseTitle">Add Course</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="courseId">
        <div class="mb-3"><label class="form-label">Category *</label>
            <select class="form-select no-select2" id="courseCategory"><option>Welding</option><option>Construction</option><option>Electrical</option><option>Other</option></select></div>
        <div class="mb-3"><label class="form-label">Course Name *</label><input class="form-control" id="courseName"></div>
        <div class="row">
            <div class="col-6 mb-3"><label class="form-label">Fee</label><input type="number" min="0" step="0.01" class="form-control" id="courseFee" value="0"></div>
            <div class="col-6 mb-3"><label class="form-label">Duration</label><input class="form-control" id="courseDuration" placeholder="e.g. 3 Months"></div>
        </div>
        <div class="row">
            <div class="col-6 mb-3"><label class="form-label">Sort Order</label><input type="number" class="form-control" id="courseSort" value="0"></div>
            <div class="col-6 mb-3 d-flex align-items-end"><div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="courseActive" checked><label class="form-check-label" for="courseActive">Active</label></div></div>
        </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="courseSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    _items: [], _timer: null,
    init: function() {
        var self = this, app = window.NL;
        self._canEdit = app.hasPermission('edit'); self._canDelete = app.hasPermission('delete');
        $('#btnAdd').toggleClass('d-none', !app.hasPermission('add'));
        self._load();
        $('#searchInput').off('input.c').on('input.c', function(){ clearTimeout(self._timer); self._timer = setTimeout(function(){ self._render(); }, 200); });
        $('#btnAdd').off('click.c').on('click.c', function(){ self._open(null); });
        $('#courseSave').off('click.c').on('click.c', function(){ self._save(); });
        $(document).off('click.c-edit').on('click.c-edit', '.c-edit', function(){ self._open(self._items.find(function(x){ return x.id == $(this).data('id'); }.bind(this))); });
        $(document).off('click.c-del').on('click.c-del', '.c-del', function(){ if (confirm('Delete this course?')) self._del($(this).data('id')); });
    },
    destroy: function() {
        clearTimeout(this._timer);
        $('#searchInput,#btnAdd,#courseSave').off('.c');
        $(document).off('click.c-edit click.c-del');
    },
    _load: function() {
        var self = this;
        $.get('api/student-courses-list.php', function(r){ if (r.success) { self._items = r.data.items; self._render(); } });
    },
    _render: function() {
        var self = this, q = ($('#searchInput').val() || '').toLowerCase();
        var rows = self._items.filter(function(c){ return !q || (c.name + ' ' + c.category).toLowerCase().indexOf(q) !== -1; }).map(function(c, i){
            var act = '';
            if (self._canEdit) act += '<button class="btn btn-sm btn-primary c-edit" data-id="' + c.id + '"><i class="bx bx-edit"></i></button> ';
            if (self._canDelete) act += '<button class="btn btn-sm btn-danger c-del" data-id="' + c.id + '"><i class="bx bx-trash"></i></button>';
            return '<tr><td>' + (i + 1) + '</td><td>' + NL.esc(c.category) + '</td><td>' + NL.esc(c.name) + '</td>' +
                '<td class="text-end">' + Number(c.fee).toLocaleString() + '</td><td>' + NL.esc(c.duration || '-') + '</td>' +
                '<td>' + (c.student_count || 0) + '</td><td>' + c.sort_order + '</td>' +
                '<td><span class="badge bg-' + (c.is_active == 1 ? 'success' : 'secondary') + '">' + (c.is_active == 1 ? 'Active' : 'Inactive') + '</span></td>' +
                '<td class="text-end text-nowrap">' + act + '</td></tr>';
        });
        $('#tableBody').html(rows.join('') || '<tr><td colspan="9" class="text-center">No courses</td></tr>');
    },
    _open: function(c) {
        $('#courseId').val(c ? c.id : '');
        $('#courseCategory').val(c ? c.category : 'Welding');
        $('#courseName').val(c ? c.name : '');
        $('#courseFee').val(c ? c.fee : 0);
        $('#courseDuration').val(c ? c.duration : '');
        $('#courseSort').val(c ? c.sort_order : 0);
        $('#courseActive').prop('checked', c ? c.is_active == 1 : true);
        $('#courseTitle').text(c ? 'Edit Course' : 'Add Course');
        $('#courseModal').modal('show');
    },
    _save: function() {
        var self = this;
        var d = { id: $('#courseId').val() || 0, category: $('#courseCategory').val(), name: $('#courseName').val().trim(), fee: $('#courseFee').val(),
                  duration: $('#courseDuration').val().trim(), sort_order: $('#courseSort').val(), is_active: $('#courseActive').is(':checked') ? 1 : 0 };
        if (!d.name) { Toast.error('Course name is required'); return; }
        $.ajax({ url: 'api/student-courses-save.php', method: 'POST', contentType: 'application/json', data: JSON.stringify(d) })
        .done(function(r){ if (r.success) { $('#courseModal').modal('hide'); self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/student-courses-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) { self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    }
};
</script>
