<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Fee Collection</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-success d-none" id="fpNew"><i class="bx bx-plus"></i> Collect Fee</button>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="row g-2 mb-3">
        <div class="col-md-4"><input type="text" class="form-control" id="fpSearch" placeholder="Search student name, ID, phone..."></div>
        <div class="col-md-3"><input type="date" class="form-control" id="fpFrom"></div>
        <div class="col-md-3"><input type="date" class="form-control" id="fpTo"></div>
        <div class="col-md-2"><button class="btn btn-outline-primary w-100" id="fpFilter"><i class="bx bx-filter"></i> Filter</button></div>
    </div>
    <div class="alert alert-light py-2 mb-3">Total collected in this view: <strong id="fpTotal">0</strong></div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Date</th><th>Student</th><th>Course</th><th class="text-end">Amount</th><th>Method</th><th>Notes</th><th>Voucher</th><th></th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
    <div id="pagination" class="d-flex justify-content-center mt-3 flex-wrap gap-1"></div>
</div></div>

<div class="modal fade" id="fpModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5>Collect Fee</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="mb-3"><label class="form-label">Find Student *</label>
            <input class="form-control" id="fpStudentSearch" placeholder="Type name, ID or phone (min 2 letters)" autocomplete="off">
            <div class="list-group mt-1" id="fpStudentResults" style="max-height:220px;overflow:auto"></div>
        </div>
        <div class="alert alert-light py-2 d-none" id="fpStudentBox"></div>
        <div class="row">
            <div class="col-6 mb-3"><label class="form-label">Amount *</label><input type="number" min="0" step="0.01" class="form-control" id="fpAmount"></div>
            <div class="col-6 mb-3"><label class="form-label">Date</label><input type="date" class="form-control" id="fpDate"></div>
        </div>
        <div class="mb-3"><label class="form-label">Payment Method</label><select class="form-select no-select2" id="fpMethod"></select></div>
        <div class="mb-3"><label class="form-label">Notes</label><input class="form-control" id="fpNotes"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success" id="fpSave">Save Payment</button></div>
</div></div></div>

<script>
window.Page = {
    _page: 1, _timer: null, _student: null,
    init: function() {
        var self = this, app = window.NL;
        self._canDelete = app.hasPermission('delete');
        $('#fpNew').toggleClass('d-none', !app.hasPermission('add'));
        $('#fpFrom').val(NL.today().slice(0, 8) + '01');
        $('#fpTo').val(NL.today());
        self._load();
        $.get('api/payment/methods-list.php', { limit: 100 }, function(r){
            if (r.success) $('#fpMethod').html(r.data.items.filter(function(m){ return m.isactive == 1; }).reverse().map(function(m){ return '<option value="' + m.id + '">' + NL.esc(m.name) + '</option>'; }).join(''));
        });
        $('#fpFilter').off('click.fp').on('click.fp', function(){ self._page = 1; self._load(); });
        $('#fpSearch').off('input.fp').on('input.fp', function(){ clearTimeout(self._timer); self._timer = setTimeout(function(){ self._page = 1; self._load(); }, 300); });
        $('#fpNew').off('click.fp').on('click.fp', function(){ self._open(); });
        $('#fpStudentSearch').off('input.fp').on('input.fp', function(){ clearTimeout(self._timer); self._timer = setTimeout(function(){ self._findStudent(); }, 300); });
        $('#fpStudentResults').off('click.fp').on('click.fp', '.fp-pick', function(){ self._pick($(this).data('s')); });
        $('#fpSave').off('click.fp').on('click.fp', function(){ self._save(); });
        $(document).off('click.fp-del').on('click.fp-del', '.fp-del', function(){ if (confirm('Delete this payment? Its Accounts voucher is removed too.')) self._del($(this).data('id')); });
    },
    destroy: function() {
        clearTimeout(this._timer);
        $('#fpFilter,#fpSearch,#fpNew,#fpStudentSearch,#fpStudentResults,#fpSave').off('.fp');
        $(document).off('click.fp-del');
    },
    _load: function() {
        var self = this;
        $.get('api/student-payments-list.php', { page: self._page, search: $('#fpSearch').val(), date_from: $('#fpFrom').val(), date_to: $('#fpTo').val() }, function(r){
            if (!r.success) return;
            $('#fpTotal').text(Number(r.data.total_amount).toLocaleString());
            $('#tableBody').html(r.data.items.map(function(p){
                return '<tr><td>' + NL.esc(p.payment_date) + '</td>' +
                    '<td><a href="admin/students/view?id=' + p.sid + '" class="nl-link">' + NL.esc(p.name) + '</a><div class="small text-muted">' + NL.esc(p.student_id) + '</div></td>' +
                    '<td>' + NL.esc(p.course_name) + '</td><td class="text-end">' + Number(p.amount).toLocaleString() + '</td>' +
                    '<td>' + NL.esc(p.payment_method || '-') + '</td><td>' + NL.esc(p.notes) + '</td><td>' + NL.esc(p.voucher_no || '—') + '</td>' +
                    '<td class="text-end">' + (self._canDelete ? '<button class="btn btn-sm btn-outline-danger fp-del" data-id="' + p.id + '"><i class="bx bx-trash"></i></button>' : '') + '</td></tr>';
            }).join('') || '<tr><td colspan="8" class="text-center">No payments in this range</td></tr>');
            var h = '', pg = r.data.pagination;
            if (pg.pages > 1) for (var i = 1; i <= pg.pages; i++) h += '<button class="btn btn-sm ' + (i === self._page ? 'btn-primary' : 'btn-outline-primary') + ' pg" data-page="' + i + '">' + i + '</button>';
            $('#pagination').html(h).off('click.fp-pg').on('click.fp-pg', '.pg', function(){ self._page = parseInt($(this).data('page'), 10); self._load(); });
        });
    },
    _open: function() {
        this._student = null;
        $('#fpStudentSearch,#fpAmount,#fpNotes').val(''); $('#fpStudentResults').empty(); $('#fpStudentBox').addClass('d-none');
        $('#fpDate').val(NL.today());
        $('#fpModal').modal('show');
    },
    _findStudent: function() {
        var q = $('#fpStudentSearch').val().trim();
        if (q.length < 2) { $('#fpStudentResults').empty(); return; }
        $.get('api/student-list.php', { search: q, limit: 10 }, function(r){
            if (!r.success) return;
            $('#fpStudentResults').html(r.data.items.map(function(s){
                return '<button type="button" class="list-group-item list-group-item-action fp-pick" data-s=\'' + NL.esc(JSON.stringify({ id: s.id, name: s.name, student_id: s.student_id, due: s.due_amount, course: s.course_name })) + '\'>' +
                    NL.esc(s.name) + ' <small class="text-muted">' + NL.esc(s.student_id) + ' · due ' + Number(s.due_amount).toLocaleString() + '</small></button>';
            }).join('') || '<div class="list-group-item text-muted">No student found</div>');
        });
    },
    _pick: function(s) {
        this._student = s;
        $('#fpStudentResults').empty(); $('#fpStudentSearch').val(s.name + ' (' + s.student_id + ')');
        $('#fpStudentBox').removeClass('d-none').html('<strong>' + NL.esc(s.name) + '</strong> · ' + NL.esc(s.course) + '<br>Due: <strong class="text-danger">' + Number(s.due).toLocaleString() + '</strong>');
        $('#fpAmount').val(s.due);
    },
    _save: function() {
        var self = this;
        if (!self._student) { Toast.error('Select a student first'); return; }
        var d = { student_id: self._student.id, amount: $('#fpAmount').val(), payment_date: $('#fpDate').val(), payment_method_id: $('#fpMethod').val(), notes: $('#fpNotes').val() };
        $.ajax({ url: 'api/student-payments-save.php', method: 'POST', contentType: 'application/json', data: JSON.stringify(d) })
        .done(function(r){ if (r.success) { $('#fpModal').modal('hide'); self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/student-payments-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) { self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    }
};
</script>
