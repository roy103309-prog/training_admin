<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Leave Type</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0"><button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> Add</button></div>
</div>
<div class="card"><div class="card-body">
    <div class="table-responsive"><table class="table table-striped align-middle">
        <thead><tr><th>ID</th><th>Leave Type</th><th>Short Name</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="5" class="text-center">Loading...</td></tr></tbody>
    </table></div>
</div></div>

<div class="modal fade" id="ltModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 id="ltTitle">Add Leave Type</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="ltId">
        <div class="mb-3"><label class="form-label">Leave Type *</label><input class="form-control" id="ltName"></div>
        <div class="mb-3"><label class="form-label">Short Name</label><input class="form-control" id="ltShort"></div>
        <div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="ltActive" checked><label class="form-check-label" for="ltActive">Active</label></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="ltSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    init: function () {
        var self = this;
        self._load();
        $('#btnAdd').off('click.lt').on('click.lt', function () {
            $('#ltId').val(''); $('#ltName').val(''); $('#ltShort').val(''); $('#ltActive').prop('checked', true);
            $('#ltTitle').text('Add Leave Type'); $('#ltModal').modal('show');
        });
        $('#ltSave').off('click.lt').on('click.lt', function () { self._save(); });
        $(document).off('click.lt-edit').on('click.lt-edit', '.lt-edit', function () { self._edit($(this).data('id')); });
        $(document).off('click.lt-del').on('click.lt-del', '.lt-del', function () { if (confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function () { $('#btnAdd,#ltSave').off('.lt'); $(document).off('click.lt-edit click.lt-del'); },
    _load: function () {
        var self = this;
        $.get('api/attendance/leave-types-list.php', function (r) {
            if (!r.success) return;
            self._items = r.data.items;
            if (!r.data.items.length) { $('#tableBody').html('<tr><td colspan="5" class="text-center">No data</td></tr>'); return; }
            $('#tableBody').html(r.data.items.map(function (x) {
                var st = parseInt(x.isactive, 10) ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>';
                return '<tr><td>' + x.id + '</td><td>' + x.name + '</td><td>' + (x.short_name || '-') + '</td><td>' + st + '</td>' +
                       '<td class="text-end"><button class="btn btn-sm btn-primary lt-edit" data-id="' + x.id + '"><i class="bx bx-edit"></i></button> ' +
                       '<button class="btn btn-sm btn-danger lt-del" data-id="' + x.id + '"><i class="bx bx-trash"></i></button></td></tr>';
            }).join(''));
        });
    },
    _save: function () {
        var self = this;
        var d = { id: parseInt($('#ltId').val(), 10) || 0, name: $('#ltName').val().trim(), short_name: $('#ltShort').val().trim(), isactive: $('#ltActive').is(':checked') ? 1 : 0 };
        $.ajax({ url: 'api/attendance/leave-types-save.php', method: 'POST', contentType: 'application/json', data: JSON.stringify(d) })
        .done(function (r) { if (r.success) { $('#ltModal').modal('hide'); self._load(); } if (window.Toast) Toast.info(r.message); else alert(r.message); });
    },
    _edit: function (id) {
        var x = (this._items || []).find(function (i) { return i.id == id; });
        if (!x) return;
        $('#ltId').val(x.id); $('#ltName').val(x.name); $('#ltShort').val(x.short_name || ''); $('#ltActive').prop('checked', parseInt(x.isactive, 10) === 1);
        $('#ltTitle').text('Edit Leave Type'); $('#ltModal').modal('show');
    },
    _del: function (id) {
        var self = this;
        $.ajax({ url: 'api/attendance/leave-types-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function (r) { if (r.success) self._load(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
