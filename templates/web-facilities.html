<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Facilities</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0"><button class="btn btn-primary d-none" id="fcAdd"><i class="bx bx-plus"></i> Add Facility</button></div>
</div>

<div class="card"><div class="card-body">
    <p class="text-muted small">Cards of the "Training Facilities" section of the website, ordered by Sort. Section heading texts: Website Texts &rarr; Facilities.</p>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Image</th><th>Title</th><th style="width:40%">Description / Points</th><th>Icon</th><th>Sort</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<div class="modal fade" id="fcModal"><div class="modal-dialog modal-lg"><div class="modal-content">
<form id="fcForm" onsubmit="return false">
    <div class="modal-header"><h5 id="fcTitle">Add Facility</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" name="id">
        <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">Title (Bangla)</label><input class="form-control" name="title_bn"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Title (English)</label><input class="form-control" name="title_en"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Description (Bangla)</label><textarea class="form-control" rows="3" name="description_bn"></textarea></div>
            <div class="col-md-6 mb-3"><label class="form-label">Description (English)</label><textarea class="form-control" rows="3" name="description_en"></textarea></div>
            <div class="col-md-6 mb-3"><label class="form-label">Points (Bangla)</label><textarea class="form-control" rows="4" name="specs_bn" placeholder="One point per line"></textarea></div>
            <div class="col-md-6 mb-3"><label class="form-label">Points (English)</label><textarea class="form-control" rows="4" name="specs_en" placeholder="One point per line, same order as Bangla"></textarea></div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3"><label class="form-label">Icon</label><select class="form-select no-select2" name="icon" id="fcIcon"></select></div>
            <div class="col-md-4 mb-3"><label class="form-label">Sort</label><input type="number" class="form-control" name="sort_order" value="0"></div>
            <div class="col-md-4 mb-3 d-flex align-items-end"><div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="fcActive" checked><label class="form-check-label" for="fcActive">Show on website</label></div></div>
        </div>
        <div class="mb-1"><label class="form-label">Image <span class="text-muted small" id="fcImgHint">(required)</span></label><input type="file" class="form-control" name="image" accept="image/*"></div>
        <img id="fcPreview" src="" style="max-height:90px;display:none" class="mt-2 border rounded">
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" id="fcSave">Save</button></div>
</form>
</div></div></div>

<script>
window.Page = {
    _items: [],
    init: function() {
        var self = this, app = window.NL;
        self._canEdit = app.hasPermission('edit'); self._canDelete = app.hasPermission('delete');
        $('#fcAdd').toggleClass('d-none', !app.hasPermission('add'));
        self._load();
        $('#fcAdd').off('click.fc').on('click.fc', function(){ self._open(null); });
        $('#fcSave').off('click.fc').on('click.fc', function(){ self._save(); });
        $('#fcForm [name=image]').off('change.fc').on('change.fc', function(){ if (this.files[0]) $('#fcPreview').attr('src', URL.createObjectURL(this.files[0])).show(); });
        $('#tableBody').off('click.fc').on('click.fc', '.fc-edit', function(){ var id = $(this).data('id'); self._open(self._items.find(function(x){ return x.id == id; })); })
            .on('click.fc', '.fc-del', function(){ if (confirm('Delete this facility?')) self._del($(this).data('id')); });
    },
    destroy: function() { $('#fcAdd,#fcSave,#tableBody,#fcForm [name=image]').off('.fc'); },
    _load: function() {
        var self = this;
        $.get('api/web-facilities-list.php', function(r){
            if (!r.success) { Toast.error(r.message); return; }
            self._items = r.data.items;
            $('#fcIcon').html(r.data.icons.map(function(i){ return '<option value="' + NL.esc(i) + '">' + NL.esc(i) + '</option>'; }).join(''));
            self._render();
        });
    },
    _render: function() {
        var self = this;
        $('#tableBody').html(self._items.map(function(v){
            var points = String(v.specs_bn || v.specs_en || '').split(/\r?\n/).filter(function(s){ return $.trim(s) !== ''; });
            var act = (self._canEdit ? '<button class="btn btn-sm btn-primary fc-edit" data-id="' + v.id + '"><i class="bx bx-edit"></i></button> ' : '') +
                      (self._canDelete ? '<button class="btn btn-sm btn-danger fc-del" data-id="' + v.id + '"><i class="bx bx-trash"></i></button>' : '');
            return '<tr><td><img src="' + NL.esc(NL.media(v.image)) + '" width="70" height="50" class="rounded" style="object-fit:cover"></td>' +
                '<td>' + NL.esc(v.title_bn) + '<div class="small text-muted">' + NL.esc(v.title_en) + '</div></td>' +
                '<td class="small">' + NL.esc(v.description_bn || v.description_en || '') + (points.length ? '<div class="text-muted">' + points.length + ' points</div>' : '') + '</td>' +
                '<td>' + NL.esc(v.icon) + '</td><td>' + v.sort_order + '</td>' +
                '<td><span class="badge bg-' + (v.is_active == 1 ? 'success' : 'secondary') + '">' + (v.is_active == 1 ? 'Active' : 'Hidden') + '</span></td>' +
                '<td class="text-end text-nowrap">' + act + '</td></tr>';
        }).join('') || '<tr><td colspan="7" class="text-center">No facilities</td></tr>');
    },
    _open: function(v) {
        var f = $('#fcForm')[0];
        f.reset();
        ['id', 'title_bn', 'title_en', 'description_bn', 'description_en', 'specs_bn', 'specs_en', 'sort_order'].forEach(function(k){ f[k].value = v ? (v[k] || '') : (k === 'sort_order' ? 0 : ''); });
        f.icon.value = v ? v.icon : 'star';
        $('#fcActive').prop('checked', v ? v.is_active == 1 : true);
        $('#fcImgHint').text(v ? '(leave empty to keep the current image)' : '(required)');
        if (v && v.image) $('#fcPreview').attr('src', NL.media(v.image)).show(); else $('#fcPreview').hide();
        $('#fcTitle').text(v ? 'Edit Facility' : 'Add Facility'); $('#fcModal').modal('show');
    },
    _save: function() {
        var self = this, fd = new FormData($('#fcForm')[0]);
        fd.set('is_active', $('#fcActive').is(':checked') ? 1 : 0);
        $.ajax({ url: 'api/web-facilities-save.php', method: 'POST', data: fd, processData: false, contentType: false })
        .done(function(r){ if (r.success) { $('#fcModal').modal('hide'); self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/web-facilities-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) { self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    }
};
</script>
