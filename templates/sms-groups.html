<div class="content">
    <div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
        <div class="d-flex flex-column">
            <div class="breadcrumb-title">SMS Groups</div>
            <nav aria-label="breadcrumb" class="mt-1">
                <ol class="breadcrumb mb-0 p-0"></ol>
            </nav>
        </div>
        <div class="ms-auto ms-md-0">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addGroupModal"><i class="bx bx-plus"></i> Add Group</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="groupsTableBody">
                        <tr><td colspan="5" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Group Modal -->
<div class="modal fade" id="addGroupModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Group</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="groupForm">
                <div class="modal-body">
                    <input type="hidden" id="groupId" />
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="groupName" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <input type="text" class="form-control" id="groupType" placeholder="e.g., VIP, Staff" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="groupDescription" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save Group</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    loadGroups();
    setupForm();
});

function loadGroups() {
    $.ajax({
        url: 'api/sms/groups.php',
        method: 'GET',
        dataType: 'json',
        success: function(resp) {
            if (resp.success && resp.data.groups) {
                var html = resp.data.groups.map(function(g) {
                    return '<tr>' +
                        '<td>' + g.name + '</td>' +
                        '<td>' + (g.type || '-') + '</td>' +
                        '<td>' + (g.description || '-') + '</td>' +
                        '<td><span class="badge bg-success">' + g.status + '</span></td>' +
                        '<td>' +
                        '<a href="javascript:void(0);" class="btn btn-sm btn-primary edit-group" data-id="' + g.id + '"><i class="bx bx-edit"></i></a>' +
                        '<a href="javascript:void(0);" class="btn btn-sm btn-danger delete-group" data-id="' + g.id + '"><i class="bx bx-trash"></i></a>' +
                        '</td>' +
                        '</tr>';
                }).join('');
                $('#groupsTableBody').html(html || '<tr><td colspan="5" class="text-center">No groups found</td></tr>');
            }
        }
    });
}

function setupForm() {
    $('#groupForm').submit(function(e) {
        e.preventDefault();
        var id = $('#groupId').val();
        var data = {
            id: id,
            name: $('#groupName').val(),
            type: $('#groupType').val(),
            description: $('#groupDescription').val()
        };

        var method = id ? 'PUT' : 'POST';
        $.ajax({
            url: 'api/sms/groups.php',
            method: method,
            contentType: 'application/json',
            data: JSON.stringify(data),
            dataType: 'json',
            success: function(resp) {
                if (resp.success) {
                    $('#addGroupModal').modal('hide');
                    $('#groupForm')[0].reset();
                    $('#groupId').val('');
                    loadGroups();
                    alert('Group saved successfully');
                } else {
                    alert('Error: ' + resp.message);
                }
            }
        });
    });

    $(document).on('click', '.edit-group', function() {
        var id = $(this).data('id');
        $.ajax({
            url: 'api/sms/groups.php?id=' + encodeURIComponent(id),
            method: 'GET',
            dataType: 'json',
            success: function(resp) {
                if (resp.success && resp.data.groups && resp.data.groups.length > 0) {
                    var g = resp.data.groups[0];
                    $('#groupId').val(g.id);
                    $('#groupName').val(g.name);
                    $('#groupType').val(g.type || '');
                    $('#groupDescription').val(g.description || '');
                    $('#addGroupModal').modal('show');
                }
            }
        });
    });

    $(document).on('click', '.delete-group', function() {
        var id = $(this).data('id');
        if (confirm('Are you sure you want to delete this group?')) {
            $.ajax({
                url: 'api/sms/groups.php',
                method: 'DELETE',
                contentType: 'application/json',
                data: JSON.stringify({id: id}),
                dataType: 'json',
                success: function(resp) {
                    if (resp.success) {
                        loadGroups();
                        alert('Group deleted successfully');
                    } else {
                        alert('Error: ' + resp.message);
                    }
                }
            });
        }
    });

    $('#addGroupModal').on('hidden.bs.modal', function() {
        $('#groupForm')[0].reset();
        $('#groupId').val('');
    });
}
</script>
