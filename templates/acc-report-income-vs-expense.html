<style>
    .report-table.ive-compact tbody td { padding: 4px 8px; font-size: 12px; }
    .report-table.ive-compact tbody tr { background: #fff; }
    .ive-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .ive-cols .report-table { margin-top: 0; }
    @media (max-width: 768px) { .ive-cols { grid-template-columns: 1fr; } }
</style>
<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Income vs Expense</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
</div>

<div class="report-page">
    <div class="card filter-bar mb-3"><div class="card-body py-2">
        <div class="d-flex flex-wrap gap-2 align-items-end">
            <div><label class="form-label small mb-1">From Date</label>
                <input type="date" class="form-control form-control-sm" id="iveFrom"></div>
            <div><label class="form-label small mb-1">To Date</label>
                <input type="date" class="form-control form-control-sm" id="iveTo"></div>
            <div class="ms-auto d-flex gap-1 align-items-end">
                <button class="btn btn-primary btn-sm"           id="iveGen"><i class="bx bx-search"></i> Generate</button>
                <button class="btn btn-outline-secondary btn-sm" id="ivePrint"><i class="bx bx-printer"></i> Print</button>
                <button class="btn btn-outline-secondary btn-sm" id="iveReset"><i class="bx bx-refresh"></i> Reset</button>
            </div>
        </div>
    </div></div>

    <div id="reportPreview" class="report-preview" style="display:none;">
        <div class="p-3 pb-0"><div id="reportHeader"></div></div>
        <div class="px-3 pb-3" id="iveBody"></div>
        <div class="px-3 pb-3 text-center">
            <small class="text-muted">Generated <span id="footerDate"></span> | Hotel365ERP | Bogura Tech Hub</small>
        </div>
    </div>
</div>

<script>
window.Page = {
    init: function () {
        var self = this;
        var t = new Date();
        $('#iveFrom').val(new Date(t.getFullYear(), t.getMonth(), 1).toISOString().slice(0,10));
        $('#iveTo').val(t.toISOString().slice(0,10));
        $('#iveGen').off('click.ive').on('click.ive', function () { self._generate(); });
        $('#iveReset').off('click.ive').on('click.ive', function () {
            var d = new Date();
            $('#iveFrom').val(new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10));
            $('#iveTo').val(d.toISOString().slice(0,10));
            $('#reportPreview').hide();
        });
        $('#ivePrint').off('click.ive').on('click.ive', function () {
            if (typeof window.printReport === 'function') window.printReport();
        });
        setTimeout(function () { self._generate(); }, 60);
    },
    destroy: function () { $('#iveGen,#iveReset,#ivePrint').off('.ive'); },

    _money: function (v) {
        var n = parseFloat(v) || 0;
        var s = '৳' + Math.abs(n).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return n < 0 ? '(' + s + ')' : s;
    },

    // Build one standalone table for a section (Income or Expense)
    _sectionTable: function (title, sec) {
        var self = this;
        var SUBTOTAL_STYLE = 'background:#fff;font-weight:700;border-top:2px solid #444;';
        var body = '';
        if (!sec.rows.length) {
            body += '<tr><td colspan="2" class="text-center text-muted">No entries</td></tr>';
        } else {
            sec.rows.forEach(function (r) {
                body += '<tr><td>' + r.name + '</td><td class="text-right">' + self._money(r.amount) + '</td></tr>';
            });
        }
        return '<table class="report-table ive-compact" style="height:100%;">' +
                   '<thead><tr><th>' + title + ' Ledger</th><th class="text-right">Amount</th></tr></thead>' +
                   '<tbody>' + body + '</tbody>' +
                   '<tfoot><tr>' +
                       '<td style="' + SUBTOTAL_STYLE + '"><strong>Total ' + title + '</strong></td>' +
                       '<td class="text-right" style="' + SUBTOTAL_STYLE + '"><strong>' + self._money(sec.total) + '</strong></td>' +
                   '</tr></tfoot>' +
               '</table>';
    },

    _generate: function () {
        var self = this;
        var from = $('#iveFrom').val(), to = $('#iveTo').val();
        if (!from || !to) { if (window.Toast) Toast.warning('Pick both dates'); return; }
        if (from > to)    { if (window.Toast) Toast.warning('From must be ≤ To'); return; }
        $('#iveBody').html('<div class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Loading...</div>');
        $('#reportPreview').show();
        if (typeof window.loadReportHeader === 'function') {
            window.loadReportHeader('Income vs Expense', from, to);
        }
        $.get('api/accounts/reports/income-vs-expense.php', { from: from, to: to }, function (r) {
            if (!r.success) { $('#iveBody').html('<div class="alert alert-danger">' + (r.message || 'Failed') + '</div>'); return; }
            var netCls = (parseFloat(r.data.net) || 0) >= 0 ? '#198754' : '#dc3545';
            // Inline grid styles so printReport's clone carries them to the print tab.
            var GRID = 'display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;';
            var COL  = 'min-width:0;';
            var html =
                '<div class="ive-cols" style="' + GRID + '">' +
                    '<div class="ive-col" style="' + COL + '">' + self._sectionTable('Income',  r.data.income)  + '</div>' +
                    '<div class="ive-col" style="' + COL + '">' + self._sectionTable('Expense', r.data.expense) + '</div>' +
                '</div>' +
                '<table class="report-table ive-compact" style="margin-top:14px;">' +
                    '<tbody><tr>' +
                        '<td style="background:#fff;font-weight:700;border-top:2px solid #000;font-size:13px;padding:8px;">Net (Income − Expense)</td>' +
                        '<td class="text-right" style="background:#fff;font-weight:700;border-top:2px solid #000;font-size:13px;padding:8px;color:' + netCls + ';">' + self._money(r.data.net) + '</td>' +
                    '</tr></tbody>' +
                '</table>';
            $('#iveBody').html(html);
        }).fail(function () {
            $('#iveBody').html('<div class="alert alert-danger">Network error</div>');
        });
    }
};
</script>
