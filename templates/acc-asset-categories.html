<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Assets Category</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> Add Asset</button>
    </div>
</div>
<div class="card"><div class="card-body">
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>Type</th><th>Name</th><th class="text-end">Opening</th><th>Opening Date</th><th>Remark</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<div class="modal fade" id="acModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 id="acTitle">Add Asset</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="acId">
        <div class="mb-3"><label class="form-label">Type *</label>
            <select class="form-select" id="acType">
                <option value="asset">Asset</option>
                <option value="fixed_asset">Fixed Asset</option>
                <option value="receivable">Receivable</option>
                <option value="payable">Payable</option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Name *</label><input class="form-control" id="acName"></div>
        <div class="row g-2 mb-3">
            <div class="col-6"><label class="form-label">Opening Balance</label><input type="number" step="0.01" class="form-control" id="acOpening" value="0"></div>
            <div class="col-6"><label class="form-label">Opening Date</label><input type="date" class="form-control" id="acDate"></div>
        </div>
        <div class="mb-3"><label class="form-label">Remark</label><input class="form-control" id="acRemark"></div>
        <div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="acActive" checked><label class="form-check-label" for="acActive">Active</label></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="acSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    init: function() {
        var self = this;
        self._load();
        $('#btnAdd').off('click.ac').on('click.ac', function(){
            $('#acId').val(''); $('#acType').val('asset'); $('#acName').val(''); $('#acOpening').val(0);
            $('#acDate').val(''); $('#acRemark').val(''); $('#acActive').prop('checked', true);
            $('#acTitle').text('Add Asset'); $('#acModal').modal('show');
        });
        $('#acSave').off('click.ac').on('click.ac', function(){ self._save(); });
        $(document).off('click.ac-edit').on('click.ac-edit', '.ac-edit', function(){ self._edit($(this).data('id')); });
        $(document).off('click.ac-del').on('click.ac-del',   '.ac-del',  function(){ if(confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function() { $('#btnAdd,#acSave').off('.ac'); $(document).off('click.ac-edit click.ac-del'); },
    _load: function() {
        var self = this;
        $.get('api/accounts/assets-list.php', function(r){
            if (!r.success) return;
            self._items = r.data.items;
            if (!r.data.items.length) { $('#tableBody').html('<tr><td colspan="8" class="text-center">No data</td></tr>'); return; }
            $('#tableBody').html(r.data.items.map(function(x){
                var st = parseInt(x.isactive,10) ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>';
                return '<tr><td>'+x.id+'</td><td>'+x.type.replace('_',' ')+'</td><td>'+x.name+'</td>' +
                       '<td class="text-end">৳'+parseFloat(x.opening_balance).toFixed(2)+'</td>' +
                       '<td>'+(x.opening_date||'-')+'</td><td>'+(x.remark||'-')+'</td><td>'+st+'</td>' +
                       '<td class="text-end"><button class="btn btn-sm btn-primary ac-edit" data-id="'+x.id+'"><i class="bx bx-edit"></i></button> ' +
                       '<button class="btn btn-sm btn-danger ac-del" data-id="'+x.id+'"><i class="bx bx-trash"></i></button></td></tr>';
            }).join(''));
        });
    },
    _save: function() {
        var self = this;
        var d = {
            id: parseInt($('#acId').val(),10) || 0,
            type: $('#acType').val(),
            name: $('#acName').val().trim(),
            opening_balance: parseFloat($('#acOpening').val()) || 0,
            opening_date: $('#acDate').val(),
            remark: $('#acRemark').val(),
            isactive: $('#acActive').is(':checked') ? 1 : 0
        };
        $.ajax({ url:'api/accounts/assets-save.php', method:'POST', contentType:'application/json', data: JSON.stringify(d) })
        .done(function(r){ if (r.success) { $('#acModal').modal('hide'); self._load(); } if (window.Toast) Toast.info(r.message); else alert(r.message); });
    },
    _edit: function(id) {
        var x = (this._items || []).find(function(i){ return i.id == id; });
        if (!x) return;
        $('#acId').val(x.id); $('#acType').val(x.type); $('#acName').val(x.name);
        $('#acOpening').val(x.opening_balance); $('#acDate').val(x.opening_date || ''); $('#acRemark').val(x.remark || '');
        $('#acActive').prop('checked', parseInt(x.isactive,10) === 1);
        $('#acTitle').text('Edit Asset'); $('#acModal').modal('show');
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url:'api/accounts/assets-delete.php', method:'POST', contentType:'application/json', data: JSON.stringify({id:id}) })
        .done(function(r){ if (r.success) self._load(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
