<style>
.prof-hero { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#fff; border-radius:10px; padding:24px; }
.prof-avatar { width:80px; height:80px; border-radius:50%; background:#fff; color:#764ba2; font-size:36px; font-weight:700; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
.prof-avatar img { width:100%; height:100%; object-fit:cover; }
.prof-meta-row { padding:6px 0; border-bottom:1px dashed #eee; display:flex; justify-content:space-between; }
.prof-meta-row:last-child { border-bottom:0; }
</style>

<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">My Profile</div>
        <nav aria-label="breadcrumb" class="mt-1">
            <ol class="breadcrumb mb-0 p-0"></ol>
        </nav>
    </div>
</div>

<div class="prof-hero mb-3 d-flex align-items-center gap-3">
    <div class="prof-avatar" id="pfAvatar">?</div>
    <div>
        <h3 class="mb-1" id="pfHeroName">Loading...</h3>
        <div class="small" id="pfHeroRole"></div>
        <div class="small" id="pfHeroLoc"></div>
    </div>
</div>

<div class="row">
    <!-- Left: Account info -->
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h6 class="mb-3">Account Info</h6>
                <div class="prof-meta-row"><span class="text-muted">Role</span><strong id="pfRole">—</strong></div>
                <div class="prof-meta-row"><span class="text-muted">Location</span><strong id="pfLoc">—</strong></div>
                <div class="prof-meta-row"><span class="text-muted">Super Admin</span><strong id="pfSuper">—</strong></div>
                <div class="prof-meta-row"><span class="text-muted">Status</span><strong id="pfStatus">—</strong></div>
                <div class="prof-meta-row"><span class="text-muted">Created</span><strong id="pfCreated">—</strong></div>
                <div class="prof-meta-row"><span class="text-muted">Last Updated</span><strong id="pfUpdated">—</strong></div>
            </div>
        </div>
    </div>

    <!-- Right: Forms -->
    <div class="col-md-8">
        <ul class="nav nav-tabs" id="profileTabs">
            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-info">Update Info</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-avatar">Profile Picture</a></li>
            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-pass">Change Password</a></li>
        </ul>
        <div class="tab-content border border-top-0 p-3">
            <!-- Update Info -->
            <div class="tab-pane fade show active" id="tab-info">
                <form id="pfInfoForm">
                    <div class="mb-3"><label class="form-label">Full Name *</label><input class="form-control" id="pfName" required></div>
                    <div class="mb-3"><label class="form-label">Mobile / Username *</label><input class="form-control" id="pfMobile" required></div>
                    <button type="button" class="btn btn-primary" id="btnSaveInfo"><i class="bx bx-save"></i> Save Changes</button>
                </form>
            </div>
            <!-- Avatar -->
            <div class="tab-pane fade" id="tab-avatar">
                <div class="mb-3">
                    <label class="form-label">Upload New Picture</label>
                    <input type="file" class="form-control" id="pfAvatarFile" accept="image/*">
                    <div class="small text-muted mt-1">Image is saved to your private uploads folder. Max 2 MB.</div>
                </div>
                <div class="mb-3">
                    <img id="pfAvatarPreview" src="" alt="" style="max-height:180px;display:none;border:1px solid #ddd;border-radius:8px;">
                </div>
                <input type="hidden" id="pfAvatarData">
                <button type="button" class="btn btn-primary" id="btnSaveAvatar"><i class="bx bx-save"></i> Save Picture</button>
                <button type="button" class="btn btn-outline-danger" id="btnRemoveAvatar"><i class="bx bx-trash"></i> Remove</button>
            </div>
            <!-- Change Password -->
            <div class="tab-pane fade" id="tab-pass">
                <form id="pfPassForm">
                    <div class="mb-3"><label class="form-label">Current Password *</label><input type="password" class="form-control" id="pfCurPass" required></div>
                    <div class="mb-3"><label class="form-label">New Password *</label><input type="password" class="form-control" id="pfNewPass" required minlength="6"></div>
                    <div class="mb-3"><label class="form-label">Confirm New Password *</label><input type="password" class="form-control" id="pfConfPass" required minlength="6"></div>
                    <button type="button" class="btn btn-primary" id="btnSavePass"><i class="bx bx-lock"></i> Change Password</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
window.Page = {
    init: function () {
        var self = this;
        self._load();
        $('#btnSaveInfo').off('click.pf').on('click.pf', function () { self._saveInfo(); });
        $('#btnSavePass').off('click.pf').on('click.pf', function () { self._savePass(); });
        $('#btnSaveAvatar').off('click.pf').on('click.pf', function () { self._saveAvatar(); });
        $('#btnRemoveAvatar').off('click.pf').on('click.pf', function () { self._removeAvatar(); });
        $('#pfAvatarFile').off('change.pf').on('change.pf', function () { self._readAvatar(this); });
    },
    destroy: function () { $('#btnSaveInfo,#btnSavePass,#btnSaveAvatar,#btnRemoveAvatar,#pfAvatarFile').off('.pf'); },
    _load: function () {
        var self = this;
        $.get('api/profile-get.php', function (r) {
            if (!r.success) { if (window.Toast) Toast.error(r.message); return; }
            self._render(r.data.profile);
        });
    },
    _render: function (p) {
        if (p.avatar) {
            $('#pfAvatar').html('<img src="' + p.avatar + '" alt="avatar">');
            $('#pfAvatarPreview').attr('src', p.avatar).show();
            $('#pfAvatarData').val(p.avatar);
        } else {
            $('#pfAvatar').text((p.name || '?').charAt(0).toUpperCase());
            $('#pfAvatarPreview').attr('src', '').hide();
            $('#pfAvatarData').val('');
        }
        $('#pfHeroName').text(p.name);
        $('#pfHeroRole').text(p.role_name || 'No role assigned');
        $('#pfHeroLoc').text(p.location_name || 'No location');

        $('#pfRole').text(p.role_name || '—');
        $('#pfLoc').text(p.location_name || '—');
        $('#pfSuper').html(p.issuperadmin == 1 ? '<span class="badge bg-danger">YES</span>' : '<span class="badge bg-secondary">No</span>');
        $('#pfStatus').html(p.isactive == 1 ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>');
        $('#pfCreated').text(p.created_at || '—');
        $('#pfUpdated').text(p.updated_at || '—');

        $('#pfName').val(p.name);
        $('#pfMobile').val(p.mobile);
    },
    _saveInfo: function () {
        var self = this;
        var payload = { name: $('#pfName').val().trim(), mobile: $('#pfMobile').val().trim() };
        if (!payload.name || !payload.mobile) { alert('Name and mobile required'); return; }
        $.ajax({
            url: 'api/profile-update.php', method: 'POST',
            contentType: 'application/json', data: JSON.stringify(payload),
            success: function (r) {
                if (window.Toast) Toast.info(r.message); else alert(r.message);
                if (r.success) {
                    // Update header username display instantly
                    $('#userName').text(payload.name);
                    self._load();
                }
            }
        });
    },
    _readAvatar: function (input) {
        if (!input.files || !input.files[0]) return;
        var f = input.files[0];
        if (f.size > 2 * 1024 * 1024) { alert('Image too large (max 2 MB)'); input.value = ''; return; }
        var reader = new FileReader();
        reader.onload = function (e) {
            $('#pfAvatarData').val(e.target.result);
            $('#pfAvatarPreview').attr('src', e.target.result).show();
        };
        reader.readAsDataURL(f);
    },
    _saveAvatar: function () {
        var self = this;
        var payload = {
            name:   $('#pfName').val().trim() || '',
            mobile: $('#pfMobile').val().trim() || '',
            avatar: $('#pfAvatarData').val() || ''
        };
        if (!payload.name || !payload.mobile) { alert('Please fill in Update Info first (name + mobile)'); return; }
        $.ajax({
            url: 'api/profile-update.php', method: 'POST',
            contentType: 'application/json', data: JSON.stringify(payload),
            success: function (r) {
                if (window.Toast) Toast.info(r.message); else alert(r.message);
                if (r.success) {
                    // Live-update header avatar
                    var avatarNow = payload.avatar;
                    if (avatarNow) $('.user-box .user-img').attr('src', avatarNow);
                    else $('.user-box .user-img').attr('src', 'assets/images/avatars/avatar-2.png');
                    // Keep sessionStorage user_data in sync
                    try {
                        var ud = JSON.parse(sessionStorage.getItem('user_data') || '{}');
                        if (ud && ud.user) { ud.user.avatar = avatarNow || null; sessionStorage.setItem('user_data', JSON.stringify(ud)); }
                    } catch (e) {}
                    self._load();
                }
            }
        });
    },
    _removeAvatar: function () {
        if (!confirm('Remove profile picture?')) return;
        $('#pfAvatarData').val('');
        $('#pfAvatarFile').val('');
        $('#pfAvatarPreview').attr('src', '').hide();
        this._saveAvatar();
    },
    _savePass: function () {
        var payload = {
            current_password: $('#pfCurPass').val(),
            new_password:     $('#pfNewPass').val(),
            confirm_password: $('#pfConfPass').val()
        };
        if (!payload.current_password || !payload.new_password) { alert('All fields required'); return; }
        if (payload.new_password !== payload.confirm_password) { alert('New passwords do not match'); return; }
        $.ajax({
            url: 'api/profile-change-password.php', method: 'POST',
            contentType: 'application/json', data: JSON.stringify(payload),
            success: function (r) {
                if (window.Toast) Toast.info(r.message); else alert(r.message);
                if (r.success) $('#pfPassForm')[0].reset();
            }
        });
    }
};
</script>
