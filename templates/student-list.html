<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Student List</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <a href="admin/students/admission" data-route class="btn btn-primary"><i class="bx bx-plus"></i> New Admission</a>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="row g-2 mb-3">
        <div class="col-md-3"><input type="text" class="form-control" id="stSearch" placeholder="Search name, ID, phone, passport, country..."></div>
        <div class="col-md-2"><select class="form-select no-select2" id="stStatus"><option value="all">All status</option><option value="active">Active</option><option value="completed">Completed</option><option value="inactive">Inactive</option><option value="dropped">Dropped</option></select></div>
        <div class="col-md-2"><select class="form-select" id="stCourse"><option value="all">All courses</option></select></div>
        <div class="col-md-2"><select class="form-select no-select2" id="stOverseas"><option value="all">All overseas status</option><option value="not_applied">Not Applied</option><option value="interview">Interview</option><option value="selected">Selected</option></select></div>
        <div class="col-md-3"><select class="form-select no-select2" id="stSort"><option value="">Newest first</option><option value="oldest">Oldest first</option><option value="name_asc">Name (A-Z)</option><option value="name_desc">Name (Z-A)</option><option value="due_desc">Due (High-Low)</option><option value="due_asc">Due (Low-High)</option></select></div>
    </div>
    <div class="small text-muted mb-2" id="stSummary"></div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Photo</th><th>Student ID</th><th>Name</th><th>Phone</th><th>Course</th><th>Admission</th><th class="text-end">Fee</th><th class="text-end">Paid</th><th class="text-end">Due</th><th class="text-end">Job Balance</th><th>Overseas</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="13" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
    <div id="pagination" class="d-flex justify-content-center mt-3 flex-wrap gap-1"></div>
</div></div>

<script>
window.Page = {
    _page: 1, _timer: null,
    init: function() {
        var self = this;
        self._canDelete = window.NL.hasPermission('delete');
        $.get('api/student-courses-list.php', function(r){
            if (!r.success) return;
            var names = {};
            r.data.items.forEach(function(c){ names[c.name] = 1; });
            $('#stCourse').html('<option value="all">All courses</option>' + Object.keys(names).map(function(n){ return '<option value="' + NL.esc(n) + '">' + NL.esc(n) + '</option>'; }).join(''));
        });
        self._load();
        $('#stSearch').off('input.st').on('input.st', function(){ clearTimeout(self._timer); self._timer = setTimeout(function(){ self._page = 1; self._load(); }, 300); });
        $('#stStatus,#stCourse,#stOverseas,#stSort').off('change.st').on('change.st', function(){ self._page = 1; self._load(); });
        $(document).off('click.st-del').on('click.st-del', '.st-del', function(){
            if (confirm('Delete this student with all payments, documents, certificates and practical jobs? This cannot be undone.')) self._del($(this).data('id'));
        });
    },
    destroy: function() {
        clearTimeout(this._timer);
        $('#stSearch,#stStatus,#stCourse,#stOverseas,#stSort').off('.st');
        $(document).off('click.st-del');
    },
    _load: function() {
        var self = this;
        $.get('api/student-list.php', { page: self._page, search: $('#stSearch').val(), status: $('#stStatus').val(), course: $('#stCourse').val(), overseas: $('#stOverseas').val(), sort: $('#stSort').val() }, function(r){
            if (!r.success) return;
            self._render(r.data.items);
            self._pag(r.data.pagination);
            $('#stSummary').text(r.data.pagination.total + ' student(s) found · ' + r.data.summary.total + ' total, ' + r.data.summary.active + ' active');
        });
    },
    _render: function(items) {
        var self = this;
        var badge = { active: 'success', completed: 'primary', inactive: 'secondary', dropped: 'danger' };
        var ovBadge = { selected: ['success', 'Selected'], interview: ['warning text-dark', 'Interview'] };
        $('#tableBody').html(items.map(function(s){
            var photo = s.photo ? NL.media(s.photo) : 'assets/images/avatars/avatar-2.png';
            return '<tr>' +
                '<td><img src="' + NL.esc(photo) + '" class="rounded" width="36" height="42" style="object-fit:cover" onerror="this.src=\'assets/images/avatars/avatar-2.png\'"></td>' +
                '<td><a href="admin/students/view?id=' + s.id + '" class="nl-link">' + NL.esc(s.student_id) + '</a></td>' +
                '<td>' + NL.esc(s.name) + (s.father_name ? '<div class="small text-muted">F: ' + NL.esc(s.father_name) + '</div>' : '') + '</td>' +
                '<td>' + NL.esc(s.phone_number || '-') + '</td>' +
                '<td>' + NL.esc(s.course_name) + '</td>' +
                '<td>' + NL.esc(s.admission_date) + '</td>' +
                '<td class="text-end">' + Number(s.course_fee).toLocaleString() + '</td>' +
                '<td class="text-end">' + Number(s.paid_amount).toLocaleString() + '</td>' +
                '<td class="text-end ' + (s.due_amount > 0 ? 'text-danger fw-semibold' : '') + '">' + Number(s.due_amount).toLocaleString() + '</td>' +
                '<td class="text-end text-primary">' + Number(s.job_balance).toLocaleString() + '</td>' +
                '<td>' + (ovBadge[s.overseas_status] ? '<span class="badge bg-' + ovBadge[s.overseas_status][0] + '">' + ovBadge[s.overseas_status][1] + '</span>' +
                    (s.destination_country || s.company_name ? '<div class="small text-muted text-truncate" style="max-width:150px">' + NL.esc([s.destination_country, s.company_name].filter(Boolean).join(' / ')) + '</div>' : '')
                    : '<span class="small text-muted">Not Applied</span>') + '</td>' +
                '<td><span class="badge bg-' + (badge[s.status] || 'secondary') + '">' + NL.esc(s.status) + '</span></td>' +
                '<td class="text-end text-nowrap"><a href="admin/students/view?id=' + s.id + '" class="btn btn-sm btn-primary nl-link" title="View / Edit"><i class="bx bx-show"></i></a> ' +
                (self._canDelete ? '<button class="btn btn-sm btn-danger st-del" data-id="' + s.id + '" title="Delete"><i class="bx bx-trash"></i></button>' : '') + '</td></tr>';
        }).join('') || '<tr><td colspan="13" class="text-center">No students found</td></tr>');
    },
    _pag: function(p) {
        var self = this, h = '';
        if (p.pages > 1) for (var i = 1; i <= p.pages; i++) h += '<button class="btn btn-sm ' + (i === self._page ? 'btn-primary' : 'btn-outline-primary') + ' pg" data-page="' + i + '">' + i + '</button>';
        $('#pagination').html(h).off('click.st-pg').on('click.st-pg', '.pg', function(){ self._page = parseInt($(this).data('page'), 10); self._load(); });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/student-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) { self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    }
};
</script>
