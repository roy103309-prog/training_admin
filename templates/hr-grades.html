<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Grade Setup</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> Add Grade</button>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="row mb-3">
        <div class="col-md-4"><input type="text" class="form-control" id="searchInput" placeholder="Search grades..."></div>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>Name</th><th>Short Name</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="5" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
    <div id="pagination" class="d-flex justify-content-center mt-3"></div>
</div></div>

<div class="modal fade" id="gradeModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 id="gradeTitle">Add Grade</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="gradeId">
        <div class="mb-3"><label class="form-label">Name *</label><input class="form-control" id="gradeName"></div>
        <div class="mb-3"><label class="form-label">Short Name</label><input class="form-control" id="gradeShort"></div>
        <div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="gradeActive" checked><label class="form-check-label" for="gradeActive">Active</label></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="gradeSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    _page: 1, _search: '', _timer: null,
    init: function() {
        var self = this;
        self._load();
        $('#searchInput').off('input.g').on('input.g', function(){
            clearTimeout(self._timer);
            self._timer = setTimeout(function(){ self._search = $('#searchInput').val(); self._page = 1; self._load(); }, 300);
        });
        $('#btnAdd').off('click.g').on('click.g', function(){
            $('#gradeId').val(''); $('#gradeName').val(''); $('#gradeShort').val(''); $('#gradeActive').prop('checked', true);
            $('#gradeTitle').text('Add Grade'); $('#gradeModal').modal('show');
        });
        $('#gradeSave').off('click.g').on('click.g', function(){ self._save(); });
        $(document).off('click.g-edit').on('click.g-edit', '.g-edit', function(){ self._edit($(this).data('id')); });
        $(document).off('click.g-del').on('click.g-del',  '.g-del',  function(){ if(confirm('Delete grade?')) self._del($(this).data('id')); });
    },
    destroy: function() {
        clearTimeout(this._timer);
        $('#searchInput,#btnAdd,#gradeSave').off('.g');
        $(document).off('click.g-edit click.g-del');
    },
    _load: function() {
        var self = this;
        $.get('api/hr/grades-list.php', { page: self._page, search: self._search }, function(r){
            if (!r.success) return;
            self._render(r.data.items);
            self._pag(r.data.pagination);
        });
    },
    _render: function(items) {
        if (!items.length) { $('#tableBody').html('<tr><td colspan="5" class="text-center">No grades</td></tr>'); return; }
        $('#tableBody').html(items.map(function(g){
            var badge = parseInt(g.isactive, 10) ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>';
            return '<tr><td>' + g.id + '</td><td>' + g.name + '</td><td>' + (g.short_name || '-') + '</td><td>' + badge + '</td>' +
                   '<td class="text-end"><button class="btn btn-sm btn-primary g-edit" data-id="' + g.id + '"><i class="bx bx-edit"></i></button> ' +
                   '<button class="btn btn-sm btn-danger g-del" data-id="' + g.id + '"><i class="bx bx-trash"></i></button></td></tr>';
        }).join(''));
    },
    _pag: function(p) {
        var self = this, h = '';
        for (var i = 1; i <= p.pages; i++) h += '<button class="btn btn-sm '+(i===self._page?'btn-primary':'btn-outline-primary')+' mx-1 pg" data-page="'+i+'">'+i+'</button>';
        $('#pagination').html(h).off('click.g-pg').on('click.g-pg', '.pg', function(){ self._page = parseInt($(this).data('page'), 10); self._load(); });
    },
    _save: function() {
        var self = this, id = $('#gradeId').val();
        var d = { id: id || undefined, name: $('#gradeName').val(), short_name: $('#gradeShort').val(), isactive: $('#gradeActive').is(':checked') ? 1 : 0 };
        $.ajax({ url: id ? 'api/hr/grades-update.php' : 'api/hr/grades-create.php', method:'POST', contentType:'application/json', data: JSON.stringify(d) })
        .done(function(r){ if (r.success) { $('#gradeModal').modal('hide'); self._load(); } if (window.Toast) Toast.info(r.message); else alert(r.message); });
    },
    _edit: function(id) {
        $.get('api/hr/grades-list.php', function(r){
            var g = (r.data.items || []).find(function(x){ return x.id == id; });
            if (!g) return;
            $('#gradeId').val(g.id); $('#gradeName').val(g.name); $('#gradeShort').val(g.short_name || '');
            $('#gradeActive').prop('checked', parseInt(g.isactive, 10) === 1);
            $('#gradeTitle').text('Edit Grade'); $('#gradeModal').modal('show');
        });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/hr/grades-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) self._load(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
