<div class="content">
    <div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
        <div class="d-flex flex-column">
            <div class="breadcrumb-title">Voice Audio Library</div>
            <nav aria-label="breadcrumb" class="mt-1">
                <ol class="breadcrumb mb-0 p-0"></ol>
            </nav>
        </div>
        <div class="ms-auto ms-md-0">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#audioUploadModal"><i class="bx bx-upload"></i> Upload Audio</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0">Audio Library</h6>
            <small class="text-muted">Audios available for voice campaigns</small>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                        <tr>
                            <th style="width:25%">Name</th>
                            <th style="width:20%">File</th>
                            <th>Preview</th>
                            <th style="width:130px" class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody id="audioTableBody">
                        <tr><td colspan="4" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="audioUploadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Upload Audio</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="audioUploadForm" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" id="audioName" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Audio File <span class="text-danger">*</span></label>
                        <input type="file" class="form-control" name="file" id="audioFile" accept="audio/*" required />
                        <small class="text-muted">Allowed: mp3, wav, ogg, m4a, aac, webm</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary"><i class="bx bx-upload"></i> Upload</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    loadAudios();
    setupAudioUpload();
});

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
}

function loadAudios() {
    $.ajax({
        url: 'api/sms/audios.php', method: 'GET', dataType: 'json',
        success: function(resp) {
            if (!resp.success || !resp.data.audios) return;
            var html = resp.data.audios.map(function(a) {
                return '<tr>' +
                    '<td>' + escapeHtml(a.name) + '</td>' +
                    '<td><small class="text-muted">' + escapeHtml(a.file_name || '-') + '</small></td>' +
                    '<td><audio controls preload="none" src="' + a.file_url + '" style="max-width:280px;height:32px"></audio></td>' +
                    '<td class="text-end">' +
                        '<a href="' + a.file_url + '" target="_blank" class="btn btn-sm btn-outline-secondary" title="Download"><i class="bx bx-download"></i></a> ' +
                        '<a href="javascript:void(0);" class="btn btn-sm btn-danger delete-audio" data-id="' + a.id + '" title="Delete"><i class="bx bx-trash"></i></a>' +
                    '</td>' +
                    '</tr>';
            }).join('');
            $('#audioTableBody').html(html || '<tr><td colspan="4" class="text-center">No audios uploaded</td></tr>');
        }
    });
}

function setupAudioUpload() {
    $('#audioUploadForm').on('submit', function(e) {
        e.preventDefault();
        var fd = new FormData(this);
        var $btn = $(this).find('button[type=submit]');
        $btn.prop('disabled', true);
        $.ajax({
            url: 'api/sms/audios.php', method: 'POST',
            data: fd, processData: false, contentType: false, dataType: 'json',
            success: function(resp) {
                if (resp.success) {
                    $('#audioUploadModal').modal('hide');
                    $('#audioUploadForm')[0].reset();
                    loadAudios();
                } else {
                    alert('Error: ' + resp.message);
                }
            },
            error: function(xhr) {
                alert('Upload failed: ' + (xhr.responseJSON && xhr.responseJSON.message || xhr.statusText));
            },
            complete: function() { $btn.prop('disabled', false); }
        });
    });

    $(document).on('click', '.delete-audio', function() {
        var id = $(this).data('id');
        if (!confirm('Delete this audio?')) return;
        $.ajax({
            url: 'api/sms/audios.php', method: 'DELETE',
            contentType: 'application/json', data: JSON.stringify({id: id}), dataType: 'json',
            success: function(resp) { if (resp.success) loadAudios(); else alert('Error: ' + resp.message); }
        });
    });
}
</script>
