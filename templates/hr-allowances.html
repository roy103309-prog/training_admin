<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Allowance / Deduction</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> Add Entry</button>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Value Type</th><th class="text-end">Amount</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<div class="modal fade" id="adModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 id="adTitle">Add Entry</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="adId">
        <div class="mb-3"><label class="form-label">Name *</label><input class="form-control" id="adName"></div>
        <div class="mb-3"><label class="form-label">Type *</label>
            <select class="form-select" id="adType">
                <option value="allowance">Allowance</option>
                <option value="deduction">Deduction</option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Value Type *</label>
            <select class="form-select" id="adValueType">
                <option value="fixed">Fixed</option>
                <option value="percentage">Percentage (% of basic)</option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Amount *</label><input type="number" step="0.01" min="0" class="form-control" id="adAmount"></div>
        <div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="adActive" checked><label class="form-check-label" for="adActive">Active</label></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="adSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    init: function() {
        var self = this;
        self._load();
        $('#btnAdd').off('click.ad').on('click.ad', function(){
            $('#adId').val(''); $('#adName').val(''); $('#adType').val('allowance');
            $('#adValueType').val('fixed'); $('#adAmount').val(''); $('#adActive').prop('checked', true);
            $('#adTitle').text('Add Entry'); $('#adModal').modal('show');
        });
        $('#adSave').off('click.ad').on('click.ad', function(){ self._save(); });
        $(document).off('click.ad-edit').on('click.ad-edit', '.ad-edit', function(){ self._edit($(this).data('id')); });
        $(document).off('click.ad-del').on('click.ad-del',  '.ad-del',  function(){ if(confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function() {
        $('#btnAdd,#adSave').off('.ad');
        $(document).off('click.ad-edit click.ad-del');
    },
    _load: function() {
        var self = this;
        $.get('api/hr/allowances-list.php', function(r){
            if (!r.success) return;
            self._render(r.data.items);
        });
    },
    _render: function(items) {
        if (!items.length) { $('#tableBody').html('<tr><td colspan="7" class="text-center">No entries</td></tr>'); return; }
        $('#tableBody').html(items.map(function(a){
            var typeBadge = a.type === 'allowance' ? '<span class="badge bg-success">Allowance</span>' : '<span class="badge bg-danger">Deduction</span>';
            var amt = a.value_type === 'percentage' ? (parseFloat(a.amount).toFixed(2) + '%') : ('৳' + parseFloat(a.amount).toFixed(2));
            var badge = parseInt(a.isactive, 10) ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>';
            return '<tr><td>'+a.id+'</td><td>'+a.name+'</td><td>'+typeBadge+'</td><td>'+a.value_type+'</td>' +
                   '<td class="text-end">'+amt+'</td><td>'+badge+'</td>' +
                   '<td class="text-end"><button class="btn btn-sm btn-primary ad-edit" data-id="'+a.id+'"><i class="bx bx-edit"></i></button> ' +
                   '<button class="btn btn-sm btn-danger ad-del" data-id="'+a.id+'"><i class="bx bx-trash"></i></button></td></tr>';
        }).join(''));
    },
    _save: function() {
        var self = this, id = $('#adId').val();
        var d = {
            id: id || undefined,
            name: $('#adName').val(),
            type: $('#adType').val(),
            value_type: $('#adValueType').val(),
            amount: parseFloat($('#adAmount').val()) || 0,
            isactive: $('#adActive').is(':checked') ? 1 : 0
        };
        $.ajax({ url: id ? 'api/hr/allowances-update.php' : 'api/hr/allowances-create.php', method:'POST', contentType:'application/json', data: JSON.stringify(d) })
        .done(function(r){ if (r.success) { $('#adModal').modal('hide'); self._load(); } if (window.Toast) Toast.info(r.message); else alert(r.message); });
    },
    _edit: function(id) {
        $.get('api/hr/allowances-list.php', function(r){
            var a = (r.data.items || []).find(function(x){ return x.id == id; });
            if (!a) return;
            $('#adId').val(a.id); $('#adName').val(a.name); $('#adType').val(a.type);
            $('#adValueType').val(a.value_type); $('#adAmount').val(a.amount);
            $('#adActive').prop('checked', parseInt(a.isactive,10) === 1);
            $('#adTitle').text('Edit Entry'); $('#adModal').modal('show');
        });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/hr/allowances-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) self._load(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
