<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Overseas &amp; Partner Companies</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0 d-flex gap-2">
        <a href="admin/employees" data-route class="btn btn-outline-secondary" title="Center staff are kept in HR → Employees"><i class="bx bx-group"></i> Center Staff</a>
        <button class="btn btn-primary" id="pcoAddBtn"><i class="bx bx-plus"></i> Add Company</button>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="row g-2 align-items-center">
        <div class="col-md-6"><input class="form-control" id="pcoSearch" placeholder="Search company, country, contact person, mobile..."></div>
        <div class="col text-end small text-muted" id="pcoCount"></div>
    </div>
</div></div>

<div class="card"><div class="card-body">
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Company Name</th><th>Country / Region</th><th>Contact Person</th><th>Mobile</th><th>Address</th><th class="text-center">Students</th><th class="text-center">Active</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<div class="modal fade" id="pcoModal"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="mb-0" id="pcoTitle">Add Company</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="pcoId">
        <div class="col-md-8"><label class="form-label">Company Name *</label><input class="form-control" id="pcoName" maxlength="190"></div>
        <div class="col-md-4"><label class="form-label">Country / Region</label><input class="form-control" id="pcoCountry" maxlength="100" list="pcoCountries"></div>
        <div class="col-md-4"><label class="form-label">Contact Person</label><input class="form-control" id="pcoContact" maxlength="150"></div>
        <div class="col-md-4"><label class="form-label">Mobile</label><input class="form-control" id="pcoMobile" maxlength="50"></div>
        <div class="col-md-4"><label class="form-label">Email</label><input type="email" class="form-control" id="pcoEmail" maxlength="190"></div>
        <div class="col-md-9"><label class="form-label">Address</label><input class="form-control" id="pcoAddress" maxlength="500"></div>
        <div class="col-md-3 d-flex align-items-end"><div class="form-check form-switch mb-2"><input type="checkbox" class="form-check-input" id="pcoActive" checked><label class="form-check-label" for="pcoActive">Active</label></div></div>
    </div></div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="pcoSave"><i class="bx bx-save"></i> Save</button></div>
</div></div></div>
<datalist id="pcoCountries"><option value="Saudi Arabia"><option value="United Arab Emirates"><option value="Qatar"><option value="Kuwait"><option value="Oman"><option value="Bahrain"><option value="Singapore"><option value="Malaysia"><option value="Romania"><option value="Croatia"></datalist>

<script>
window.Page = {
    _items: [], _timer: null,
    init: function() {
        var self = this;
        self._load();
        $('#pcoSearch').off('input.pco').on('input.pco', function(){ clearTimeout(self._timer); self._timer = setTimeout(function(){ self._load(); }, 300); });
        $('#pcoAddBtn').off('click.pco').on('click.pco', function(){ self._open(); });
        $('#pcoSave').off('click.pco').on('click.pco', function(){ self._save(); });
        $(document).off('click.pco-edit').on('click.pco-edit', '.pco-edit', function(){ self._open($(this).data('id')); });
        $(document).off('click.pco-del').on('click.pco-del', '.pco-del', function(){
            if (!confirm('Delete this company?')) return;
            $.ajax({ url: 'api/practical-companies-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: $(this).data('id') }) })
            .done(function(r){ if (r.success) { Toast.success(r.message); self._load(); } else Toast.error(r.message); });
        });
    },
    destroy: function() {
        clearTimeout(this._timer);
        $('#pcoSearch,#pcoAddBtn,#pcoSave').off('.pco');
        $(document).off('click.pco-edit click.pco-del');
    },
    _load: function() {
        var self = this;
        $.get('api/practical-companies-list.php', { search: $('#pcoSearch').val() }, function(r){
            if (!r.success) { Toast.error(r.message); return; }
            self._items = r.data.items;
            $('#pcoCount').text(self._items.length + ' compan' + (self._items.length === 1 ? 'y' : 'ies'));
            $('#tableBody').html(self._items.map(function(c){
                return '<tr' + (c.is_active == 1 ? '' : ' class="text-muted"') + '><td class="fw-semibold">' + NL.esc(c.name) + (c.email ? '<div class="small text-muted fw-normal">' + NL.esc(c.email) + '</div>' : '') + '</td>' +
                    '<td>' + (c.country ? '<span class="badge bg-light text-dark border">' + NL.esc(c.country) + '</span>' : '-') + '</td>' +
                    '<td>' + NL.esc(c.contact_person || '-') + '</td><td class="font-monospace">' + NL.esc(c.mobile || '-') + '</td>' +
                    '<td class="small text-muted">' + NL.esc(c.address || '-') + '</td>' +
                    '<td class="text-center">' + c.student_count + (c.selected_count > 0 ? ' <span class="badge bg-success" title="Selected">' + c.selected_count + ' selected</span>' : '') + '</td>' +
                    '<td class="text-center">' + (c.is_active == 1 ? '<i class="bx bx-check-circle text-success"></i>' : '<i class="bx bx-x-circle"></i>') + '</td>' +
                    '<td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary pco-edit" data-id="' + c.id + '"><i class="bx bx-edit"></i></button> ' +
                    '<button class="btn btn-sm btn-outline-danger pco-del" data-id="' + c.id + '"><i class="bx bx-trash"></i></button></td></tr>';
            }).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">No companies yet. Click "Add Company".</td></tr>');
        });
    },
    _open: function(id) {
        var c = this._items.find(function(x){ return x.id == id; }) || {};
        $('#pcoTitle').text(c.id ? 'Edit Company' : 'Add Company');
        $('#pcoId').val(c.id || ''); $('#pcoName').val(c.name || ''); $('#pcoCountry').val(c.country || ''); $('#pcoContact').val(c.contact_person || '');
        $('#pcoMobile').val(c.mobile || ''); $('#pcoEmail').val(c.email || ''); $('#pcoAddress').val(c.address || '');
        $('#pcoActive').prop('checked', !c.id || c.is_active == 1);
        $('#pcoModal').modal('show');
    },
    _save: function() {
        var self = this, $btn = $('#pcoSave').prop('disabled', true);
        var d = { id: $('#pcoId').val(), name: $('#pcoName').val(), country: $('#pcoCountry').val(), contact_person: $('#pcoContact').val(),
                  mobile: $('#pcoMobile').val(), email: $('#pcoEmail').val(), address: $('#pcoAddress').val(), is_active: $('#pcoActive').is(':checked') ? 1 : 0 };
        $.ajax({ url: 'api/practical-companies-save.php', method: 'POST', contentType: 'application/json', data: JSON.stringify(d) })
        .done(function(r){ if (r.success) { Toast.success(r.message); $('#pcoModal').modal('hide'); self._load(); } else Toast.error(r.message); })
        .always(function(){ $btn.prop('disabled', false); });
    }
};
</script>
