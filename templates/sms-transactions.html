<div class="content">
    <div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
        <div class="d-flex flex-column">
            <div class="breadcrumb-title">SMS Transactions</div>
            <nav aria-label="breadcrumb" class="mt-1">
                <ol class="breadcrumb mb-0 p-0"></ol>
            </nav>
        </div>
        <div class="ms-auto ms-md-0">
            <a href="admin/sms-packages" data-route class="btn btn-primary"><i class="bx bx-plus"></i> Buy SMS</a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Invoice</th>
                            <th>Date</th>
                            <th>Package</th>
                            <th>SMS (Total)</th>
                            <th>Amount</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="txnTableBody">
                        <tr><td colspan="8" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() { loadTransactions(); });

function loadTransactions() {
    $.ajax({
        url: 'api/sms/transactions.php', method: 'GET', dataType: 'json',
        success: function(resp) {
            if (!resp.success || !resp.data.transactions) return;
            var html = resp.data.transactions.map(function(t) {
                var statusCls = t.status === 'Paid' ? 'success' : (t.status === 'Failed' ? 'danger' : 'warning');
                var action = (t.status === 'Pending')
                    ? '<button class="btn btn-sm btn-success approve-txn" data-id="' + t.id + '">Approve</button>'
                    : '<span class="text-muted small">-</span>';
                return '<tr>' +
                    '<td><small>' + t.invoice_no + '</small></td>' +
                    '<td>' + (t.created_at || '-') + '</td>' +
                    '<td>' + t.package_name + '</td>' +
                    '<td>' + t.sms_count + (t.bonus_sms ? ' +' + t.bonus_sms : '') + ' (' + t.total_sms + ')</td>' +
                    '<td>৳' + parseFloat(t.amount).toFixed(2) + '</td>' +
                    '<td>' + t.payment_method + '</td>' +
                    '<td><span class="badge bg-' + statusCls + '">' + t.status + '</span></td>' +
                    '<td>' + action + '</td>' +
                    '</tr>';
            }).join('');
            $('#txnTableBody').html(html || '<tr><td colspan="8" class="text-center">No transactions found</td></tr>');
        }
    });
}

$(document).on('click', '.approve-txn', function() {
    var id = $(this).data('id');
    if (!confirm('Approve this transaction and credit SMS balance?')) return;
    $.ajax({
        url: 'api/sms/transactions.php', method: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify({id: id}),
        dataType: 'json',
        success: function(resp) {
            if (resp.success) {
                alert('Approved! SMS balance credited.');
                loadTransactions();
            } else {
                alert('Error: ' + resp.message);
            }
        }
    });
});
</script>
