<style>
    .report-table.bs-compact tbody td { padding: 4px 8px; font-size: 12px; }
    .report-table.bs-compact .bs-section td { background: #e9ecef; color: #1a1a1a; padding: 6px 8px; font-size: 13px; text-align: center !important; }
    .report-table.bs-compact .bs-subtotal td { background: #f1f3f5; border-top: 1px solid #999; border-bottom: 1px solid #999; }
    .report-table.bs-compact .bs-grand td { background: #1a1a1a; color: #fff; font-weight: 700; }
    .report-table.bs-compact tbody tr { background: #fff; }
    .bs-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 8px 12px; border-radius: 4px; margin-top: 10px; }
</style>
<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Balance Sheet</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
</div>

<div class="report-page">
    <div class="card filter-bar mb-3"><div class="card-body py-2">
        <div class="d-flex flex-wrap gap-2 align-items-end">
            <div><label class="form-label small mb-1">As Of Date</label>
                <input type="date" class="form-control form-control-sm" id="bsTo"></div>
            <div class="ms-auto d-flex gap-1 align-items-end">
                <button class="btn btn-primary btn-sm"           id="bsGen"><i class="bx bx-search"></i> Generate</button>
                <button class="btn btn-outline-secondary btn-sm" id="bsPrint"><i class="bx bx-printer"></i> Print</button>
                <button class="btn btn-outline-secondary btn-sm" id="bsReset"><i class="bx bx-refresh"></i> Reset</button>
            </div>
        </div>
    </div></div>

    <div id="reportPreview" class="report-preview" style="display:none;">
        <div class="p-3 pb-0"><div id="reportHeader"></div></div>
        <div class="px-3 pb-3" id="bsBody"></div>
        <div class="px-3 pb-3 text-center">
            <small class="text-muted">Generated <span id="footerDate"></span> | Hotel365ERP | Bogura Tech Hub</small>
        </div>
    </div>
</div>

<script>
window.Page = {
    init: function () {
        var self = this;
        $('#bsTo').val(new Date().toISOString().slice(0,10));
        $('#bsGen').off('click.bs').on('click.bs', function () { self._generate(); });
        $('#bsReset').off('click.bs').on('click.bs', function () {
            $('#bsTo').val(new Date().toISOString().slice(0,10));
            $('#reportPreview').hide();
        });
        $('#bsPrint').off('click.bs').on('click.bs', function () {
            if (typeof window.printReport === 'function') window.printReport();
        });
        setTimeout(function () { self._generate(); }, 60);
    },
    destroy: function () { $('#bsGen,#bsReset,#bsPrint').off('.bs'); },

    _money: function (v) {
        var n = parseFloat(v) || 0;
        return '৳' + n.toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    },

    _sectionRows: function (title, rows, total) {
        var self = this;
        var SECTION_STYLE  = 'background:#fff;font-weight:700;text-align:center;padding:6px 8px;border-top:1px solid #444;border-bottom:1px solid #444;';
        var SUBTOTAL_STYLE = 'background:#fff;font-weight:700;border-top:1px solid #999;border-bottom:1px solid #999;';
        var html = '<tr><td colspan="2" style="' + SECTION_STYLE + '">' + title + '</td></tr>';
        if (!rows || !rows.length) {
            html += '<tr><td colspan="2" class="text-center text-muted">No entries</td></tr>';
        } else {
            rows.forEach(function (r) {
                html += '<tr><td>' + r.name + '</td><td class="text-right">' + self._money(r.closing) + '</td></tr>';
            });
        }
        html += '<tr>' +
                    '<td style="' + SUBTOTAL_STYLE + '"><strong>' + title + ' Total</strong></td>' +
                    '<td class="text-right" style="' + SUBTOTAL_STYLE + '"><strong>' + self._money(total) + '</strong></td>' +
                '</tr>';
        return html;
    },

    _generate: function () {
        var self = this;
        var to = $('#bsTo').val();
        if (!to) { if (window.Toast) Toast.warning('Pick date'); return; }
        $('#bsBody').html('<div class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Loading...</div>');
        $('#reportPreview').show();

        if (typeof window.loadReportHeader === 'function') {
            window.loadReportHeader('Balance Sheet', '', to);
        }

        $.get('api/accounts/reports/balance-sheet.php', { to: to }, function (r) {
            if (!r.success) { $('#bsBody').html('<div class="alert alert-danger">' + (r.message || 'Failed') + '</div>'); return; }
            var s = r.data.sections;

            // Merge asset rows: current + fixed
            var assetRows = (s.current_assets.rows || []).concat(s.fixed_assets.rows || []);
            var assetsTotal = (s.current_assets.total || 0) + (s.fixed_assets.total || 0);

            // Merge liabilities: liability categories + payable asset types
            var liabRows = (s.liabilities.rows || []).concat(s.payables.rows || []);
            var liabTotal = (s.liabilities.total || 0) + (s.payables.total || 0);

            var body =
                self._sectionRows('Assets',      assetRows, assetsTotal) +
                self._sectionRows('Liabilities', liabRows,  liabTotal);

            var html = '<div class="table-responsive"><table class="report-table bs-compact">' +
                '<thead><tr><th>Ledger</th><th class="text-right">Balance</th></tr></thead>' +
                '<tbody>' + body + '</tbody></table></div>';

            $('#bsBody').html(html);
        }).fail(function () {
            $('#bsBody').html('<div class="alert alert-danger">Network error</div>');
        });
    }
};
</script>
