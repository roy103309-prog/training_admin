<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Menu Management</div>
        <nav aria-label="breadcrumb" class="mt-1">
            <ol class="breadcrumb mb-0 p-0"></ol>
    </nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> Add Menu</button>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>ID</th><th>Name</th><th>Icon</th><th>URL</th><th>Parent</th><th>Sort</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addEditModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 id="modalTitle">Add Menu</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="itemId">
                <div class="mb-3"><label>Name *</label><input type="text" class="form-control" id="itemName" required></div>
                <div class="mb-3"><label>Icon (bx-...)</label><input type="text" class="form-control" id="itemIcon" placeholder="bx-home"></div>
                <div class="mb-3"><label>URL</label><input type="text" class="form-control" id="itemUrl" placeholder="page.html or leave empty for parent"></div>
                <div class="mb-3"><label>Parent Menu</label><select class="form-select" id="itemParent"><option value="">None (Top Level)</option></select></div>
                <div class="mb-3"><label>Sort Order</label><input type="number" class="form-control" id="itemSort" value="0"></div>
                <div class="mb-3"><label>Status</label><select class="form-select" id="itemStatus"><option value="1">Active</option><option value="0">Inactive</option></select></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSave">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
window.Page = {
    _menus: [],
    init: function() {
        var self = this;
        self._loadData();
        $('#btnAdd').off('click.mnu').on('click.mnu', function(){ $('#modalTitle').text('Add Menu'); $('input').val(''); $('#itemSort').val('0'); $('#itemStatus').val('1'); $('#addEditModal').modal('show'); });
        $('#btnSave').off('click.mnu').on('click.mnu', function(){ self._save(); });
        $(document).off('click.mnu-edit').on('click.mnu-edit', '.btn-edit', function(){ self._edit($(this).data('id')); });
        $(document).off('click.mnu-del').on('click.mnu-del', '.btn-delete', function(){ if(confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function() { $('#btnAdd').off('click.mnu'); $('#btnSave').off('click.mnu'); $(document).off('click.mnu-edit click.mnu-del'); },
    _loadData: function() {
        var self=this;
        $.ajax({url:'api/user/menus-list.php',
            success:function(r){if(r.success){self._menus=r.data.items;self._renderTable(r.data.items);self._updateParentDD();}},
            error:function(){$('#tableBody').html('<tr><td colspan="8" class="text-danger text-center">Error</td></tr>');}});
    },
    _updateParentDD: function() {
        $('#itemParent').html('<option value="">None (Top Level)</option>'+this._menus.filter(function(m){return !m.parent_id;}).map(function(m){return '<option value="'+m.id+'">'+m.name+'</option>';}).join(''));
    },
    _renderTable: function(items) {
        $('#tableBody').html(items.map(function(i){ return '<tr><td>'+i.id+'</td><td>'+i.name+'</td><td><i class="bx '+i.icon+'"></i> '+i.icon+'</td><td>'+(i.url||'-')+'</td><td>'+(i.parent_name||'-')+'</td><td>'+i.sort_order+'</td><td><span class="badge bg-'+(i.isactive?'success':'danger')+'">'+(i.isactive?'Active':'Inactive')+'</span></td><td><button class="btn btn-sm btn-primary btn-edit" data-id="'+i.id+'"><i class="bx bx-edit"></i></button> <button class="btn btn-sm btn-danger btn-delete" data-id="'+i.id+'"><i class="bx bx-trash"></i></button></td></tr>'; }).join('')||'<tr><td colspan="8" class="text-center">No data</td></tr>');
    },
    _save: function() {
        var self=this,id=$('#itemId').val();
        var d={id:id||undefined,name:$('#itemName').val(),icon:$('#itemIcon').val(),url:$('#itemUrl').val(),parent_id:parseInt($('#itemParent').val())||0,sort_order:parseInt($('#itemSort').val()),isactive:parseInt($('#itemStatus').val())};
        $.ajax({url:id?'api/user/menus-update.php':'api/user/menus-create.php',method:'POST',contentType:'application/json',data:JSON.stringify(d),
            success:function(r){if(r.success){$('#addEditModal').modal('hide');self._loadData();}if(window.Toast)Toast.info(r.message);else alert(r.message);},
            error:function(){if(window.Toast)Toast.info('Failed');else alert('Failed');}});
    },
    _edit: function(id) {
        var i=this._menus.find(function(x){return x.id==id;});
        if(i){$('#itemId').val(i.id);$('#itemName').val(i.name);$('#itemIcon').val(i.icon);$('#itemUrl').val(i.url);$('#itemParent').val(i.parent_id||'');$('#itemSort').val(i.sort_order);$('#itemStatus').val(i.isactive);$('#modalTitle').text('Edit Menu');$('#addEditModal').modal('show');}
    },
    _del: function(id) {
        var self=this;
        $.ajax({url:'api/user/menus-delete.php',method:'POST',contentType:'application/json',data:JSON.stringify({id:id}),
            success:function(r){if(r.success)self._loadData();if(window.Toast)Toast.info(r.message);else alert(r.message);},
            error:function(){if(window.Toast)Toast.info('Failed');else alert('Failed');}});
    }
};
</script>
