<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Contact Messages</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
</div>

<div class="card"><div class="card-body">
    <p class="text-muted small">Messages sent from the website contact form. <span id="msUnread"></span></p>
    <div class="table-responsive">
        <table class="table align-middle">
            <thead><tr><th>Date</th><th>Name</th><th>Contact</th><th style="width:45%">Message</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="5" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<script>
window.Page = {
    init: function() {
        var self = this, app = window.NL;
        self._canEdit = app.hasPermission('edit'); self._canDelete = app.hasPermission('delete');
        self._load();
        $('#tableBody').off('click.ms').on('click.ms', '.ms-mark', function(){ self._post('api/web-messages-mark.php', { id: $(this).data('id'), is_read: $(this).data('read') }); })
            .on('click.ms', '.ms-del', function(){ if (confirm('Delete this message?')) self._post('api/web-messages-delete.php', { id: $(this).data('id') }); });
    },
    destroy: function() { $('#tableBody').off('.ms'); },
    _load: function() {
        var self = this;
        $.get('api/web-messages-list.php', function(r){
            if (!r.success) return;
            $('#msUnread').text(r.data.unread ? r.data.unread + ' unread.' : '');
            $('#tableBody').html(r.data.items.map(function(m){
                var act = (self._canEdit ? '<button class="btn btn-sm btn-outline-primary ms-mark" data-id="' + m.id + '" data-read="' + (m.is_read == 1 ? 0 : 1) + '" title="' + (m.is_read == 1 ? 'Mark unread' : 'Mark read') + '"><i class="bx ' + (m.is_read == 1 ? 'bx-envelope' : 'bx-envelope-open') + '"></i></button> ' : '') +
                          (self._canDelete ? '<button class="btn btn-sm btn-outline-danger ms-del" data-id="' + m.id + '"><i class="bx bx-trash"></i></button>' : '');
                return '<tr class="' + (m.is_read == 1 ? '' : 'fw-semibold table-warning') + '"><td class="small">' + NL.esc(m.created_at) + '</td><td>' + NL.esc(m.name) + '</td>' +
                    '<td class="small">' + NL.esc(m.phone) + (m.email ? '<br>' + NL.esc(m.email) : '') + '</td><td class="small" style="white-space:pre-wrap">' + NL.esc(m.message) + '</td>' +
                    '<td class="text-end text-nowrap">' + act + '</td></tr>';
            }).join('') || '<tr><td colspan="5" class="text-center text-muted">No messages</td></tr>');
        });
    },
    _post: function(url, data) {
        var self = this;
        $.ajax({ url: url, method: 'POST', contentType: 'application/json', data: JSON.stringify(data) })
        .done(function(r){ if (r.success) { self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    }
};
</script>
