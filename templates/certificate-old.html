<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Old Certificates</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-primary d-none" id="ocAdd"><i class="bx bx-plus"></i> Add Certificate</button>
    </div>
</div>

<div class="card"><div class="card-body">
    <p class="text-muted small">Legacy certificates searched on the website by roll + registration number.</p>
    <div class="row mb-3"><div class="col-md-4"><input class="form-control" id="ocSearch" placeholder="Search name, roll, registration..."></div></div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Image</th><th>Name</th><th>Date of Birth</th><th>Roll</th><th>Registration</th><th>Address</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
    <div id="pagination" class="d-flex justify-content-center mt-3 flex-wrap gap-1"></div>
</div></div>

<div class="modal fade" id="ocModal"><div class="modal-dialog"><div class="modal-content">
<form id="ocForm" onsubmit="return false">
    <div class="modal-header"><h5 id="ocTitle">Add Certificate</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" name="id">
        <div class="mb-3"><label class="form-label">Name *</label><input class="form-control" name="CrtName"></div>
        <div class="row">
            <div class="col-6 mb-3"><label class="form-label">Roll *</label><input class="form-control" name="CrtRoll"></div>
            <div class="col-6 mb-3"><label class="form-label">Registration *</label><input class="form-control" name="CrtRegi"></div>
        </div>
        <div class="mb-3"><label class="form-label">Date of Birth</label><input type="date" class="form-control" name="CrtDob"></div>
        <div class="mb-3"><label class="form-label">Address</label><input class="form-control" name="CrtAddress"></div>
        <div class="mb-3"><label class="form-label">Certificate Image</label><input type="file" class="form-control" name="image" accept="image/*"></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" id="ocSave">Save</button></div>
</form>
</div></div></div>

<script>
window.Page = {
    _page: 1, _timer: null, _items: [],
    init: function() {
        var self = this, app = window.NL;
        self._canEdit = app.hasPermission('edit'); self._canDelete = app.hasPermission('delete');
        $('#ocAdd').toggleClass('d-none', !app.hasPermission('add'));
        self._load();
        $('#ocSearch').off('input.oc').on('input.oc', function(){ clearTimeout(self._timer); self._timer = setTimeout(function(){ self._page = 1; self._load(); }, 300); });
        $('#ocAdd').off('click.oc').on('click.oc', function(){ self._open(null); });
        $('#ocSave').off('click.oc').on('click.oc', function(){ self._save(); });
        $(document).off('click.oc-edit').on('click.oc-edit', '.oc-edit', function(){ var id = $(this).data('id'); self._open(self._items.find(function(x){ return x.id == id; })); });
        $(document).off('click.oc-del').on('click.oc-del', '.oc-del', function(){ if (confirm('Delete this certificate?')) self._del($(this).data('id')); });
    },
    destroy: function() {
        clearTimeout(this._timer);
        $('#ocSearch,#ocAdd,#ocSave').off('.oc');
        $(document).off('click.oc-edit click.oc-del');
    },
    _load: function() {
        var self = this;
        $.get('api/certificate-old-list.php', { page: self._page, search: $('#ocSearch').val() }, function(r){
            if (!r.success) return;
            self._items = r.data.items;
            $('#tableBody').html(r.data.items.map(function(c){
                var img = c.CrtImg ? '<a href="' + NL.esc(NL.media(c.CrtImg)) + '" target="_blank"><img src="' + NL.esc(NL.media(c.CrtImg)) + '" height="40"></a>' : '—';
                var act = (self._canEdit ? '<button class="btn btn-sm btn-primary oc-edit" data-id="' + c.id + '"><i class="bx bx-edit"></i></button> ' : '') +
                          (self._canDelete ? '<button class="btn btn-sm btn-danger oc-del" data-id="' + c.id + '"><i class="bx bx-trash"></i></button>' : '');
                return '<tr><td>' + img + '</td><td>' + NL.esc(c.CrtName) + '</td><td>' + NL.esc(c.CrtDob || '') + '</td><td>' + NL.esc(c.CrtRoll) + '</td>' +
                    '<td>' + NL.esc(c.CrtRegi) + '</td><td>' + NL.esc(c.CrtAddress) + '</td><td class="text-end text-nowrap">' + act + '</td></tr>';
            }).join('') || '<tr><td colspan="7" class="text-center">No old certificates</td></tr>');
            var p = r.data.pagination, h = '';
            if (p.pages > 1) for (var i = 1; i <= p.pages; i++) h += '<button class="btn btn-sm ' + (i === self._page ? 'btn-primary' : 'btn-outline-primary') + ' pg" data-page="' + i + '">' + i + '</button>';
            $('#pagination').html(h).off('click.oc-pg').on('click.oc-pg', '.pg', function(){ self._page = parseInt($(this).data('page'), 10); self._load(); });
        });
    },
    _open: function(c) {
        var f = $('#ocForm')[0];
        f.reset();
        ['id', 'CrtName', 'CrtRoll', 'CrtRegi', 'CrtDob', 'CrtAddress'].forEach(function(k){ f[k].value = c ? (c[k] || '') : ''; });
        $('#ocTitle').text(c ? 'Edit Certificate' : 'Add Certificate');
        $('#ocModal').modal('show');
    },
    _save: function() {
        var self = this;
        $.ajax({ url: 'api/certificate-old-save.php', method: 'POST', data: new FormData($('#ocForm')[0]), processData: false, contentType: false })
        .done(function(r){ if (r.success) { $('#ocModal').modal('hide'); self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/certificate-old-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) { self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    }
};
</script>
