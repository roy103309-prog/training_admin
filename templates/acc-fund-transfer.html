<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Fund Transfer</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0"><button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> New Transfer</button></div>
</div>

<div class="card mb-3"><div class="card-body">
    <div class="table-responsive"><table class="table table-striped align-middle">
        <thead><tr><th>ID</th><th>Date</th><th>Voucher</th><th>From</th><th>To</th><th class="text-end">Amount</th><th>Note</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody>
    </table></div>
</div></div>

<div class="modal fade" id="trModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5>New Fund Transfer</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <div class="row g-2">
            <div class="col-md-6"><label class="form-label">Date *</label><input type="date" class="form-control" id="trDate"></div>
            <div class="col-md-6"><label class="form-label">Voucher</label><input class="form-control" value="Auto" readonly></div>
            <div class="col-md-6"><label class="form-label">From Account *</label><select class="form-select" id="trFrom"></select></div>
            <div class="col-md-6"><label class="form-label">To Account *</label><select class="form-select" id="trTo"></select></div>
            <div class="col-md-6"><label class="form-label">Amount *</label><input type="number" step="0.01" min="0" class="form-control" id="trAmt"></div>
            <div class="col-md-6"><label class="form-label">&nbsp;</label><div class="text-end fw-bold">Total: ৳<span id="trTotal">0.00</span></div></div>
            <div class="col-12"><label class="form-label">Note</label><input class="form-control" id="trNote"></div>
        </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="trSave">Submit</button></div>
</div></div></div>

<script>
window.Page = {
    init: function(){
        var self = this;
        self._loadList();
        $.get('api/accounts/assets-list.php', function(r){
            if (!r.success) return;
            var opts = '<option value="">--</option>' + (r.data.items||[]).filter(function(x){return parseInt(x.isactive,10)===1;}).map(function(x){ return '<option value="'+x.id+'">'+x.name+'</option>'; }).join('');
            $('#trFrom,#trTo').html(opts);
        });
        $('#btnAdd').off('click.tr').on('click.tr', function(){ self._openAdd(); });
        $('#trAmt').off('input.tr').on('input.tr', function(){ $('#trTotal').text((parseFloat($(this).val())||0).toFixed(2)); });
        $('#trSave').off('click.tr').on('click.tr', function(){ self._save(); });
    },
    destroy: function(){ $('#btnAdd,#trSave,#trAmt').off('.tr'); },
    _loadList: function(){
        $.get('api/accounts/voucher-list.php', { type: 'transfer' }, function(r){
            if (!r.success) return;
            if (!r.data.items.length) { $('#tableBody').html('<tr><td colspan="7" class="text-center">No transfers</td></tr>'); return; }
            $('#tableBody').html(r.data.items.map(function(v){
                return '<tr><td>'+v.id+'</td><td>'+v.voucher_date+'</td><td>'+v.voucher_no+'</td>' +
                       '<td>'+(v.from_name||'-')+'</td><td>'+(v.to_name||'-')+'</td>' +
                       '<td class="text-end">৳'+parseFloat(v.total).toFixed(2)+'</td>' +
                       '<td>'+(v.note||'-')+'</td></tr>';
            }).join(''));
        });
    },
    _openAdd: function(){
        $('#trDate').val(new Date().toISOString().slice(0,10));
        $('#trFrom').val(''); $('#trTo').val(''); $('#trAmt').val(''); $('#trNote').val(''); $('#trTotal').text('0.00');
        $('#trModal').modal('show');
    },
    _save: function(){
        var self = this;
        var d = {
            voucher_date:  $('#trDate').val(),
            from_asset_id: parseInt($('#trFrom').val(),10) || 0,
            to_asset_id:   parseInt($('#trTo').val(),10) || 0,
            amount:        parseFloat($('#trAmt').val()) || 0,
            note:          $('#trNote').val()
        };
        $.ajax({ url:'api/accounts/transfer-save.php', method:'POST', contentType:'application/json', data: JSON.stringify(d) })
        .done(function(r){
            if (r.success) { $('#trModal').modal('hide'); self._loadList(); }
            if (window.Toast) Toast.info(r.message); else alert(r.message);
        });
    }
};
</script>
