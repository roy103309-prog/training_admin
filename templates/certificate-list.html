<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Student Certificates</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
</div>

<div class="row">
    <!-- Students -->
    <div class="col-lg-5">
        <div class="card"><div class="card-body">
            <div class="row g-2 mb-2">
                <div class="col-7"><input class="form-control" id="ctSearch" placeholder="Search name or ID..."></div>
                <div class="col-5"><select class="form-select no-select2" id="ctStatus"><option value="all">All status</option><option value="active">Active</option><option value="completed">Completed</option><option value="inactive">Inactive</option><option value="dropped">Dropped</option></select></div>
            </div>
            <div class="list-group" id="ctStudents" style="max-height:62vh;overflow:auto"></div>
            <div id="ctPagination" class="d-flex justify-content-center mt-2 flex-wrap gap-1"></div>
        </div></div>
    </div>

    <!-- Selected student -->
    <div class="col-lg-7">
        <div class="card"><div class="card-body" id="ctEmpty"><p class="text-muted mb-0">Select a student to generate or upload certificates.</p></div>
            <div class="card-body d-none" id="ctPanel">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <img id="ctPhoto" src="" width="64" height="76" class="rounded" style="object-fit:cover" onerror="this.src='assets/images/avatars/avatar-2.png'">
                    <div><h5 class="mb-0" id="ctName"></h5><div class="text-muted" id="ctMeta"></div></div>
                </div>

                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#ctGen" type="button">Generate</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#ctUp" type="button">Upload</button></li>
                </ul>
                <div class="tab-content border border-top-0 p-3 mb-3">
                    <div class="tab-pane fade show active" id="ctGen">
                        <div class="row g-2">
                            <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" id="ctTitle" value="Certificate of Completion"></div>
                            <div class="col-md-3"><label class="form-label">Number</label><input class="form-control" id="ctNumber" placeholder="Auto"></div>
                            <div class="col-md-3"><label class="form-label">Issue Date</label><input type="date" class="form-control" id="ctIssue"></div>
                        </div>
                        <button class="btn btn-primary mt-3 ct-add" id="ctGenerate"><i class="bx bx-award"></i> Generate &amp; Print</button>
                    </div>
                    <div class="tab-pane fade" id="ctUp">
                        <div class="row g-2">
                            <div class="col-md-6"><label class="form-label">Certificate File (image / PDF)</label><input type="file" class="form-control" id="ctFile" accept="image/*,.pdf"></div>
                            <div class="col-md-3"><label class="form-label">Issue Date</label><input type="date" class="form-control" id="ctUpIssue"></div>
                            <div class="col-md-3"><label class="form-label">Description</label><input class="form-control" id="ctDesc"></div>
                        </div>
                        <div class="small text-muted mt-2">Uploaded certificates appear on the website "New Certificate" search (roll number + date of birth).</div>
                        <button class="btn btn-primary mt-2 ct-add" id="ctUpload"><i class="bx bx-upload"></i> Upload</button>
                    </div>
                </div>

                <h6>History</h6>
                <div class="table-responsive"><table class="table align-middle">
                    <thead><tr><th>Type</th><th>Number / File</th><th>Title</th><th>Issue Date</th><th class="text-end">Actions</th></tr></thead>
                    <tbody id="ctHistory"></tbody>
                </table></div>
            </div>
        </div>
    </div>
</div>

<script>
window.Page = {
    _page: 1, _timer: null, _student: null, _certs: [],
    init: function() {
        var self = this, app = window.NL;
        self._canAdd = app.hasPermission('add'); self._canDelete = app.hasPermission('delete');
        if (!self._canAdd) $('.ct-add').addClass('d-none');
        var today = NL.today();
        $('#ctIssue,#ctUpIssue').val(today);
        self._loadInstitute();
        self._loadStudents();
        var pre = parseInt(new URLSearchParams(location.search).get('student_id'), 10);
        if (pre) self._select(pre);
        $('#ctSearch').off('input.ct').on('input.ct', function(){ clearTimeout(self._timer); self._timer = setTimeout(function(){ self._page = 1; self._loadStudents(); }, 300); });
        $('#ctStatus').off('change.ct').on('change.ct', function(){ self._page = 1; self._loadStudents(); });
        $('#ctStudents').off('click.ct').on('click.ct', '.ct-st', function(){ self._select($(this).data('id')); });
        $('#ctGenerate').off('click.ct').on('click.ct', function(){ self._generate(); });
        $('#ctUpload').off('click.ct').on('click.ct', function(){ self._upload(); });
        $('#ctHistory').off('click.ct').on('click.ct', '.ct-print', function(){ self._print(self._certs.find(function(c){ return c.id == $(this).data('id'); }.bind(this))); })
            .on('click.ct', '.ct-del', function(){ if (confirm('Delete this certificate?')) self._del($(this).data('id')); });
    },
    destroy: function() {
        clearTimeout(this._timer);
        $('#ctSearch,#ctStatus,#ctStudents,#ctGenerate,#ctUpload,#ctHistory').off('.ct');
    },
    // Certificate header: Settings -> Institute Information (logo, name, address, contact, website)
    _loadInstitute: function() {
        if (!window.CertificatePrint) return;
        CertificatePrint.setInstitute({ name: NL.instituteName() });
        $.get('api/settings/basic-get.php', function(r){
            if (!r.success || !r.data) return;
            var s = r.data;
            CertificatePrint.setInstitute({
                name: s.website_name, address: s.address, logo: s.website_logo || s.logo, verifyUrl: s.website_url,
                contact: [s.website_url, s.email, s.phone].filter(Boolean).join(' || ')
            });
        });
    },
    _loadStudents: function() {
        var self = this;
        $.get('api/student-list.php', { page: self._page, limit: 25, search: $('#ctSearch').val(), status: $('#ctStatus').val() }, function(r){
            if (!r.success) return;
            $('#ctStudents').html(r.data.items.map(function(s){
                var badge = (s.cert_generated + s.cert_uploaded) ? '<span class="badge bg-success">' + (s.cert_generated + s.cert_uploaded) + '</span>' : '';
                return '<button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center ct-st' + (self._student && self._student.id == s.id ? ' active' : '') + '" data-id="' + s.id + '">' +
                    '<span>' + NL.esc(s.name) + '<br><small>' + NL.esc(s.student_id) + ' · ' + NL.esc(s.course_name) + '</small></span>' + badge + '</button>';
            }).join('') || '<div class="list-group-item text-muted">No students</div>');
            var p = r.data.pagination, h = '';
            if (p.pages > 1) for (var i = 1; i <= p.pages; i++) h += '<button class="btn btn-sm ' + (i === self._page ? 'btn-primary' : 'btn-outline-primary') + ' pg" data-page="' + i + '">' + i + '</button>';
            $('#ctPagination').html(h).off('click.ct-pg').on('click.ct-pg', '.pg', function(){ self._page = parseInt($(this).data('page'), 10); self._loadStudents(); });
        });
    },
    _select: function(id) {
        var self = this;
        $.get('api/student-get.php', { id: id }, function(r){
            if (!r.success) return;
            self._student = r.data.student;
            self._certs = r.data.certificates;
            var s = self._student;
            $('#ctEmpty').addClass('d-none'); $('#ctPanel').removeClass('d-none');
            $('#ctPhoto').attr('src', s.photo ? NL.media(s.photo) : 'assets/images/avatars/avatar-2.png');
            $('#ctName').text(s.name);
            $('#ctMeta').text(s.student_id + ' · ' + s.course_name + (s.dob ? ' · DOB ' + s.dob : ''));
            $('#ctStudents .ct-st').removeClass('active').filter('[data-id="' + s.id + '"]').addClass('active');
            self._renderHistory();
        });
    },
    _renderHistory: function() {
        var self = this;
        $('#ctHistory').html(self._certs.map(function(c){
            var up = c.source === 'uploaded';
            var label = up ? '<a href="' + NL.esc(NL.media(c.file_path)) + '" target="_blank">' + NL.esc(c.title || 'file') + '</a>' : NL.esc(c.certificate_no);
            var act = up ? '<a class="btn btn-sm btn-outline-primary" target="_blank" href="' + NL.esc(NL.media(c.file_path)) + '"><i class="bx bx-show"></i></a> '
                         : '<button class="btn btn-sm btn-outline-primary ct-print" data-id="' + c.id + '"><i class="bx bx-printer"></i></button> ';
            if (self._canDelete) act += '<button class="btn btn-sm btn-outline-danger ct-del" data-id="' + c.id + '"><i class="bx bx-trash"></i></button>';
            return '<tr><td>' + (up ? 'Uploaded' : 'Generated') + '</td><td>' + label + '</td><td>' + NL.esc(up ? (c.description || '') : c.title) + '</td><td>' + NL.esc(c.issue_date || '') + '</td><td class="text-end text-nowrap">' + act + '</td></tr>';
        }).join('') || '<tr><td colspan="5" class="text-center text-muted">No certificates yet</td></tr>');
    },
    _print: function(c) {
        if (!c || !window.CertificatePrint) return;
        var s = this._student;
        var meta = {};
        try { meta = JSON.parse(c.description || '{}') || {}; } catch (e) {}
        CertificatePrint.open(
            { issueDate: c.issue_date, title: c.title, number: c.certificate_no, course_name: s.course_name, metadata: meta },
            { student_id: s.student_id, name: s.name, photo: s.photo, father_name: s.father_name, mother_name: s.mother_name,
              date_of_birth: s.dob, passport_number: s.passport_number, course_name: s.course_name, course_category: s.course_category }
        );
    },
    _generate: function() {
        var self = this, s = self._student;
        if (!s) return;
        var d = { student_id: s.id, title: $('#ctTitle').val(), number: $('#ctNumber').val(), issue_date: $('#ctIssue').val(),
                  metadata: { course_name: s.course_name, date_of_birth: s.dob, father_name: s.father_name, mother_name: s.mother_name, passport_number: s.passport_number } };
        $.ajax({ url: 'api/certificate-generate.php', method: 'POST', contentType: 'application/json', data: JSON.stringify(d) })
        .done(function(r){
            if (!r.success) { Toast.error(r.message); return; }
            Toast.success(r.message);
            self._print({ id: r.data.id, issue_date: r.data.issue_date, title: r.data.title, certificate_no: r.data.certificate_no, description: JSON.stringify(d.metadata) });
            $('#ctNumber').val('');
            self._select(s.id); self._loadStudents();
        });
    },
    _upload: function() {
        var self = this, s = self._student, f = $('#ctFile')[0].files[0];
        if (!s) return;
        if (!f) { Toast.error('Please select a file'); return; }
        var fd = new FormData();
        fd.append('student_id', s.id); fd.append('certificate_file', f); fd.append('issue_date', $('#ctUpIssue').val()); fd.append('description', $('#ctDesc').val());
        $.ajax({ url: 'api/certificate-upload.php', method: 'POST', data: fd, processData: false, contentType: false })
        .done(function(r){
            if (r.success) { Toast.success(r.message); $('#ctFile,#ctDesc').val(''); self._select(s.id); self._loadStudents(); }
            else Toast.error(r.message);
        });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/certificate-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) { Toast.success(r.message); self._select(self._student.id); self._loadStudents(); } else Toast.error(r.message); });
    }
};
</script>
