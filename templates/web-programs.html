<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Programs</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0"><button class="btn btn-primary d-none" id="pgAdd"><i class="bx bx-plus"></i> Add Program</button></div>
</div>

<div class="card"><div class="card-body">
    <p class="text-muted small">Programs shown on the website home page and on their own page (/programs/&lt;slug&gt;).</p>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Image</th><th>Title</th><th>Slug</th><th>Level / Duration</th><th>Price</th><th>Home</th><th>Sort</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="9" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<div class="modal fade" id="pgModal"><div class="modal-dialog modal-lg"><div class="modal-content">
<form id="pgForm" onsubmit="return false">
    <div class="modal-header"><h5 id="pgTitle">Add Program</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
        <input type="hidden" name="id">
        <div class="col-md-6"><label class="form-label">Title (English) *</label><input class="form-control" name="title"></div>
        <div class="col-md-6"><label class="form-label">Title (Bangla)</label><input class="form-control" name="title_bn"></div>
        <div class="col-md-6"><label class="form-label">URL Slug</label><input class="form-control" name="slug" placeholder="auto from title"></div>
        <div class="col-md-6"><label class="form-label">Subtitle</label><input class="form-control" name="subtitle"></div>
        <div class="col-md-4"><label class="form-label">Level</label><input class="form-control" name="level"></div>
        <div class="col-md-4"><label class="form-label">Duration</label><input class="form-control" name="duration"></div>
        <div class="col-md-4"><label class="form-label">Price</label><input class="form-control" name="price"></div>
        <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="5" name="description"></textarea></div>
        <div class="col-md-6"><label class="form-label">Image</label><input type="file" class="form-control" name="image" accept="image/*"></div>
        <div class="col-md-2"><label class="form-label">Sort</label><input type="number" class="form-control" name="sort_order" value="0"></div>
        <div class="col-md-4 d-flex flex-column justify-content-end">
            <div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="pgHome" checked><label class="form-check-label" for="pgHome">Show on home page</label></div>
            <div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="pgActive" checked><label class="form-check-label" for="pgActive">Active</label></div>
        </div>
    </div></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" id="pgSave">Save</button></div>
</form>
</div></div></div>

<script>
window.Page = {
    _items: [],
    init: function() {
        var self = this, app = window.NL;
        self._canEdit = app.hasPermission('edit'); self._canDelete = app.hasPermission('delete');
        $('#pgAdd').toggleClass('d-none', !app.hasPermission('add'));
        self._load();
        $('#pgAdd').off('click.pg').on('click.pg', function(){ self._open(null); });
        $('#pgSave').off('click.pg').on('click.pg', function(){ self._save(); });
        $('#tableBody').off('click.pg').on('click.pg', '.pg-edit', function(){ var id = $(this).data('id'); self._open(self._items.find(function(x){ return x.id == id; })); })
            .on('click.pg', '.pg-del', function(){ if (confirm('Delete this program?')) self._del($(this).data('id')); });
    },
    destroy: function() { $('#pgAdd,#pgSave,#tableBody').off('.pg'); },
    _load: function() {
        var self = this;
        $.get('api/web-programs-list.php', function(r){
            if (!r.success) return;
            self._items = r.data.items;
            $('#tableBody').html(r.data.items.map(function(p){
                var img = p.image ? '<img src="' + NL.esc(NL.media(p.image)) + '" width="70" height="44" class="rounded" style="object-fit:cover">' : '—';
                var act = (self._canEdit ? '<button class="btn btn-sm btn-primary pg-edit" data-id="' + p.id + '"><i class="bx bx-edit"></i></button> ' : '') +
                          (self._canDelete ? '<button class="btn btn-sm btn-danger pg-del" data-id="' + p.id + '"><i class="bx bx-trash"></i></button>' : '');
                return '<tr><td>' + img + '</td><td>' + NL.esc(p.title) + '<div class="small text-muted">' + NL.esc(p.title_bn) + '</div></td>' +
                    '<td><code>' + NL.esc(p.slug) + '</code></td>' +
                    '<td>' + NL.esc(p.level) + '<div class="small text-muted">' + NL.esc(p.duration) + '</div></td><td>' + NL.esc(p.price) + '</td>' +
                    '<td>' + (p.show_on_home == 1 ? '<i class="bx bx-check text-success fs-5"></i>' : '') + '</td><td>' + p.sort_order + '</td>' +
                    '<td><span class="badge bg-' + (p.is_active == 1 ? 'success' : 'secondary') + '">' + (p.is_active == 1 ? 'Active' : 'Hidden') + '</span></td>' +
                    '<td class="text-end text-nowrap">' + act + '</td></tr>';
            }).join('') || '<tr><td colspan="9" class="text-center">No programs</td></tr>');
        });
    },
    _open: function(p) {
        var f = $('#pgForm')[0];
        f.reset();
        ['id', 'title', 'title_bn', 'slug', 'subtitle', 'level', 'duration', 'price', 'description', 'sort_order'].forEach(function(k){ f[k].value = p ? (p[k] || '') : (k === 'sort_order' ? 0 : ''); });
        $('#pgHome').prop('checked', p ? p.show_on_home == 1 : true); $('#pgActive').prop('checked', p ? p.is_active == 1 : true);
        $('#pgTitle').text(p ? 'Edit Program' : 'Add Program'); $('#pgModal').modal('show');
    },
    _save: function() {
        var self = this, fd = new FormData($('#pgForm')[0]);
        fd.set('show_on_home', $('#pgHome').is(':checked') ? 1 : 0); fd.set('is_active', $('#pgActive').is(':checked') ? 1 : 0);
        $.ajax({ url: 'api/web-programs-save.php', method: 'POST', data: fd, processData: false, contentType: false })
        .done(function(r){ if (r.success) { $('#pgModal').modal('hide'); self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/web-programs-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) { self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    }
};
</script>
