<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Branches / Locations</div>
        <nav aria-label="breadcrumb" class="mt-1">
            <ol class="breadcrumb mb-0 p-0"></ol>
    </nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> Add Branch</button>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
                <tr><th style="width:50px">#</th><th>Name</th><th>Address</th><th>Phone</th><th>Email</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="tableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<div class="modal fade" id="locModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Branch</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form id="locForm">
                    <input type="hidden" id="locId">
                    <div class="mb-3"><label class="form-label">Branch Name *</label><input class="form-control" id="locName" required></div>
                    <div class="mb-3"><label class="form-label">Address</label><textarea class="form-control" id="locAddress" rows="2"></textarea></div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Phone</label><input class="form-control" id="locPhone"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="locEmail"></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Status</label>
                        <select class="form-select" id="locStatus"><option value="1">Active</option><option value="0">Inactive</option></select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSave">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
window.Page = {
    _items: [],
    init: function () {
        var self = this;
        self._load();
        $('#btnAdd').off('click.loc').on('click.loc', function () { self._openAdd(); });
        $('#btnSave').off('click.loc').on('click.loc', function () { self._save(); });
        $(document).off('click.loc-edit').on('click.loc-edit', '.loc-edit', function () { self._openEdit($(this).data('id')); });
        $(document).off('click.loc-del').on('click.loc-del', '.loc-del', function () {
            if (confirm('Delete this branch? This may fail if the branch has related data.')) self._delete($(this).data('id'));
        });
    },
    destroy: function () {
        $('#btnAdd,#btnSave').off('.loc');
        $(document).off('click.loc-edit click.loc-del');
    },
    _load: function () {
        var self = this;
        $.get('api/locations/locations-list.php', function (r) {
            if (!r.success) { $('#tableBody').html('<tr><td colspan="7" class="text-center text-danger">' + r.message + '</td></tr>'); return; }
            self._items = r.data.items || [];
            self._render();
        });
    },
    _render: function () {
        var rows = this._items.map(function (l, idx) {
            return '<tr>' +
                '<td class="text-muted">' + (idx + 1) + '</td>' +
                '<td><strong>' + l.name + '</strong></td>' +
                '<td>' + (l.address || '<span class="text-muted">—</span>') + '</td>' +
                '<td>' + (l.phone || '—') + '</td>' +
                '<td>' + (l.email || '—') + '</td>' +
                '<td><span class="badge bg-' + (l.isactive == 1 ? 'success' : 'secondary') + '">' + (l.isactive == 1 ? 'Active' : 'Inactive') + '</span></td>' +
                '<td>' +
                '<button class="btn btn-sm btn-primary loc-edit" data-id="' + l.id + '"><i class="bx bx-edit"></i></button> ' +
                '<button class="btn btn-sm btn-danger loc-del" data-id="' + l.id + '"><i class="bx bx-trash"></i></button>' +
                '</td></tr>';
        }).join('');
        $('#tableBody').html(rows || '<tr><td colspan="7" class="text-center text-muted">No branches</td></tr>');
    },
    _openAdd: function () {
        $('#modalTitle').text('Add Branch');
        $('#locForm')[0].reset();
        $('#locId').val('');
        $('#locStatus').val('1');
        $('#locModal').modal('show');
    },
    _openEdit: function (id) {
        var l = this._items.find(function (x) { return x.id == id; });
        if (!l) return;
        $('#modalTitle').text('Edit Branch');
        $('#locId').val(l.id);
        $('#locName').val(l.name);
        $('#locAddress').val(l.address || '');
        $('#locPhone').val(l.phone || '');
        $('#locEmail').val(l.email || '');
        $('#locStatus').val(l.isactive);
        $('#locModal').modal('show');
    },
    _save: function () {
        var self = this;
        var payload = {
            id: $('#locId').val() || 0,
            name: $('#locName').val().trim(),
            address: $('#locAddress').val().trim(),
            phone: $('#locPhone').val().trim(),
            email: $('#locEmail').val().trim(),
            isactive: parseInt($('#locStatus').val(), 10)
        };
        if (!payload.name) { alert('Name required'); return; }
        $.ajax({
            url: 'api/locations/locations-save.php', method: 'POST',
            contentType: 'application/json', data: JSON.stringify(payload),
            success: function (r) {
                if (window.Toast) Toast.info(r.message); else alert(r.message);
                if (r.success) { $('#locModal').modal('hide'); self._load(); }
            }
        });
    },
    _delete: function (id) {
        var self = this;
        $.ajax({
            url: 'api/locations/locations-delete.php', method: 'POST',
            contentType: 'application/json', data: JSON.stringify({ id: id }),
            success: function (r) {
                if (window.Toast) Toast.info(r.message); else alert(r.message);
                if (r.success) self._load();
            }
        });
    }
};
</script>
