<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Videos</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0"><button class="btn btn-primary d-none" id="vdAdd"><i class="bx bx-plus"></i> Add Video</button></div>
</div>

<div class="card"><div class="card-body">
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Preview</th><th>Title</th><th>URL</th><th>Sort</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="6" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<div class="modal fade" id="vdModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 id="vdTitle">Add Video</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="vdId">
        <div class="mb-3"><label class="form-label">Video URL * <small class="text-muted">(YouTube link or .mp4)</small></label><input class="form-control" id="vdUrl"></div>
        <div class="mb-3"><label class="form-label">Title</label><input class="form-control" id="vdName"></div>
        <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" rows="3" id="vdDesc"></textarea></div>
        <div class="row">
            <div class="col-6 mb-3"><label class="form-label">Sort Order</label><input type="number" class="form-control" id="vdSort" value="0"></div>
            <div class="col-6 mb-3 d-flex align-items-end"><div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="vdActive" checked><label class="form-check-label" for="vdActive">Active</label></div></div>
        </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="vdSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    _items: [],
    init: function() {
        var self = this, app = window.NL;
        self._canEdit = app.hasPermission('edit'); self._canDelete = app.hasPermission('delete');
        $('#vdAdd').toggleClass('d-none', !app.hasPermission('add'));
        self._load();
        $('#vdAdd').off('click.vd').on('click.vd', function(){ self._open(null); });
        $('#vdSave').off('click.vd').on('click.vd', function(){ self._save(); });
        $('#tableBody').off('click.vd').on('click.vd', '.vd-edit', function(){ var id = $(this).data('id'); self._open(self._items.find(function(x){ return x.id == id; })); })
            .on('click.vd', '.vd-del', function(){ if (confirm('Delete this video?')) self._del($(this).data('id')); });
    },
    destroy: function() { $('#vdAdd,#vdSave,#tableBody').off('.vd'); },
    _load: function() {
        var self = this;
        $.get('api/web-videos-list.php', function(r){
            if (!r.success) return;
            self._items = r.data.items;
            $('#tableBody').html(r.data.items.map(function(v){
                var act = (self._canEdit ? '<button class="btn btn-sm btn-primary vd-edit" data-id="' + v.id + '"><i class="bx bx-edit"></i></button> ' : '') +
                          (self._canDelete ? '<button class="btn btn-sm btn-danger vd-del" data-id="' + v.id + '"><i class="bx bx-trash"></i></button>' : '');
                return '<tr><td>' + (v.thumb ? '<img src="' + NL.esc(v.thumb) + '" height="48" class="rounded">' : '<i class="bx bx-video fs-3"></i>') + '</td>' +
                    '<td>' + NL.esc(v.title) + '</td><td class="small"><a href="' + NL.esc(v.video_url) + '" target="_blank">' + NL.esc(v.video_url) + '</a></td>' +
                    '<td>' + v.sort_order + '</td><td><span class="badge bg-' + (v.is_active == 1 ? 'success' : 'secondary') + '">' + (v.is_active == 1 ? 'Active' : 'Hidden') + '</span></td>' +
                    '<td class="text-end text-nowrap">' + act + '</td></tr>';
            }).join('') || '<tr><td colspan="6" class="text-center">No videos</td></tr>');
        });
    },
    _open: function(v) {
        $('#vdId').val(v ? v.id : ''); $('#vdUrl').val(v ? v.video_url : ''); $('#vdName').val(v ? v.title : '');
        $('#vdDesc').val(v ? (v.description || '') : ''); $('#vdSort').val(v ? v.sort_order : 0); $('#vdActive').prop('checked', v ? v.is_active == 1 : true);
        $('#vdTitle').text(v ? 'Edit Video' : 'Add Video'); $('#vdModal').modal('show');
    },
    _save: function() {
        var self = this;
        var d = { id: $('#vdId').val() || 0, video_url: $('#vdUrl').val().trim(), title: $('#vdName').val(), description: $('#vdDesc').val(),
                  sort_order: $('#vdSort').val(), is_active: $('#vdActive').is(':checked') ? 1 : 0 };
        $.ajax({ url: 'api/web-videos-save.php', method: 'POST', contentType: 'application/json', data: JSON.stringify(d) })
        .done(function(r){ if (r.success) { $('#vdModal').modal('hide'); self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/web-videos-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) { self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    }
};
</script>
