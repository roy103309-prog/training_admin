<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Holiday</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0 d-flex gap-2 flex-wrap align-items-center mt-2 mt-md-0">
        <a href="admin/attendance/holiday-setup" data-route class="btn btn-md btn-outline-primary d-inline-flex align-items-center gap-1"><i class="bx bx-calendar"></i> Monthly Setup</a>
        <button type="button" class="btn btn-md btn-primary d-inline-flex align-items-center gap-1" id="btnAdd"><i class="bx bx-plus"></i> Add Holiday</button>
    </div>
</div>
<div class="card"><div class="card-body">
    <div class="table-responsive"><table class="table table-striped align-middle">
        <thead><tr><th>ID</th><th>Holiday Type</th><th>Date</th><th>Reason</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="6" class="text-center">Loading...</td></tr></tbody>
    </table></div>
</div></div>

<div class="modal fade" id="hModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 id="hTitle">Add Holiday</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="hId">
        <div class="mb-3"><label class="form-label">Holiday Type</label><select class="form-select" id="hType"><option value="">--</option></select></div>
        <div class="mb-3"><label class="form-label">Date *</label><input type="date" class="form-control" id="hDate"></div>
        <div class="mb-3"><label class="form-label">Reason</label><input class="form-control" id="hReason"></div>
        <div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="hActive" checked><label class="form-check-label" for="hActive">Active</label></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="hSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    init: function () {
        var self = this;
        self._loadTypes();
        self._load();
        $('#btnAdd').off('click.h').on('click.h', function () {
            $('#hId').val(''); $('#hType').val(''); $('#hDate').val(''); $('#hReason').val(''); $('#hActive').prop('checked', true);
            $('#hTitle').text('Add Holiday'); $('#hModal').modal('show');
        });
        $('#hSave').off('click.h').on('click.h', function () { self._save(); });
        $(document).off('click.h-edit').on('click.h-edit', '.h-edit', function () { self._edit($(this).data('id')); });
        $(document).off('click.h-del').on('click.h-del', '.h-del', function () { if (confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function () { $('#btnAdd,#hSave').off('.h'); $(document).off('click.h-edit click.h-del'); },
    _loadTypes: function () {
        $.get('api/attendance/holiday-types-list.php', function (r) {
            if (!r.success) return;
            $('#hType').html('<option value="">--</option>' + (r.data.items || []).filter(function (x) { return parseInt(x.isactive, 10) === 1; }).map(function (x) {
                return '<option value="' + x.id + '">' + x.name + '</option>';
            }).join(''));
        });
    },
    _fmtDate: function (v) {
        if (!v) return '-';
        var d = new Date(v);
        return isNaN(d.getTime()) ? v : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    },
    _load: function () {
        var self = this;
        $.get('api/attendance/holidays-list.php', function (r) {
            if (!r.success) return;
            self._items = r.data.items;
            if (!r.data.items.length) { $('#tableBody').html('<tr><td colspan="6" class="text-center">No data</td></tr>'); return; }
            $('#tableBody').html(r.data.items.map(function (x) {
                var st = parseInt(x.isactive, 10) ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>';
                return '<tr><td>' + x.id + '</td><td>' + (x.type_name || '-') + '</td><td>' + self._fmtDate(x.holiday_date) + '</td>' +
                       '<td>' + (x.reason || '-') + '</td><td>' + st + '</td>' +
                       '<td class="text-end"><button class="btn btn-sm btn-primary h-edit" data-id="' + x.id + '"><i class="bx bx-edit"></i></button> ' +
                       '<button class="btn btn-sm btn-danger h-del" data-id="' + x.id + '"><i class="bx bx-trash"></i></button></td></tr>';
            }).join(''));
        });
    },
    _save: function () {
        var self = this;
        var d = {
            id: parseInt($('#hId').val(), 10) || 0,
            holiday_type_id: parseInt($('#hType').val(), 10) || 0,
            holiday_date: $('#hDate').val(),
            reason: $('#hReason').val().trim(),
            isactive: $('#hActive').is(':checked') ? 1 : 0
        };
        $.ajax({ url: 'api/attendance/holidays-save.php', method: 'POST', contentType: 'application/json', data: JSON.stringify(d) })
        .done(function (r) { if (r.success) { $('#hModal').modal('hide'); self._load(); } if (window.Toast) Toast.info(r.message); else alert(r.message); });
    },
    _edit: function (id) {
        var x = (this._items || []).find(function (i) { return i.id == id; });
        if (!x) return;
        $('#hId').val(x.id); $('#hType').val(x.holiday_type_id || ''); $('#hDate').val(x.holiday_date);
        $('#hReason').val(x.reason || ''); $('#hActive').prop('checked', parseInt(x.isactive, 10) === 1);
        $('#hTitle').text('Edit Holiday'); $('#hModal').modal('show');
    },
    _del: function (id) {
        var self = this;
        $.ajax({ url: 'api/attendance/holidays-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function (r) { if (r.success) self._load(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
