<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Salary History</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <a href="admin/hr/salary-generate" data-route class="btn btn-primary"><i class="bx bx-plus"></i> Generate Salary</a>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>Employee</th><th>Code</th><th>Period</th><th>Type</th><th class="text-end">Basic</th><th class="text-end">Allow.</th><th class="text-end">Deduct.</th><th class="text-end">Net</th><th>Status</th><th>Date</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="11" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
    <div id="pagination" class="d-flex justify-content-center mt-3"></div>
</div></div>

<script>
window.Page = {
    _page: 1,
    init: function() { this._load(); },
    destroy: function() {},
    _load: function() {
        var self = this;
        $.get('api/hr/salaries-list.php', { page: self._page }, function(r){
            if (!r.success) return;
            self._render(r.data.items);
            self._pag(r.data.pagination);
        });
    },
    _render: function(items) {
        if (!items.length) { $('#tableBody').html('<tr><td colspan="11" class="text-center">No salaries generated</td></tr>'); return; }
        $('#tableBody').html(items.map(function(s){
            var status = s.status === 'paid' ? '<span class="badge bg-success">Paid</span>' : '<span class="badge bg-warning text-dark">Pending</span>';
            return '<tr><td>'+s.id+'</td><td>'+s.employee_name+'</td><td>'+(s.employee_code||'-')+'</td>' +
                   '<td>'+s.period_label+'</td><td>'+s.period_type+'</td>' +
                   '<td class="text-end">৳'+parseFloat(s.basic_salary).toFixed(2)+'</td>' +
                   '<td class="text-end text-success">৳'+parseFloat(s.total_allowance).toFixed(2)+'</td>' +
                   '<td class="text-end text-danger">৳'+parseFloat(s.total_deduction).toFixed(2)+'</td>' +
                   '<td class="text-end"><strong>৳'+parseFloat(s.net_amount).toFixed(2)+'</strong></td>' +
                   '<td>'+status+'</td><td>'+s.created_at+'</td></tr>';
        }).join(''));
    },
    _pag: function(p) {
        var self = this, h = '';
        for (var i = 1; i <= p.pages; i++) h += '<button class="btn btn-sm '+(i===self._page?'btn-primary':'btn-outline-primary')+' mx-1 pg" data-page="'+i+'">'+i+'</button>';
        $('#pagination').html(h).off('click.sh-pg').on('click.sh-pg', '.pg', function(){ self._page = parseInt($(this).data('page'),10); self._load(); });
    }
};
</script>
