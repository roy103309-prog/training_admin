<div class="content">
    <div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
        <div class="d-flex flex-column">
            <div class="breadcrumb-title">SMS Contacts</div>
            <nav aria-label="breadcrumb" class="mt-1">
                <ol class="breadcrumb mb-0 p-0"></ol>
            </nav>
        </div>
        <div class="ms-auto ms-md-0">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addContactModal"><i class="bx bx-plus"></i> Add Contact</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Group</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">
                        <tr><td colspan="5" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Contact Modal -->
<div class="modal fade" id="addContactModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Contact</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="contactForm">
                <div class="modal-body">
                    <input type="hidden" id="contactId" />
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="contactName" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" id="contactPhone" placeholder="Phone number" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Group</label>
                        <select class="form-select" id="contactGroup" required>
                            <option value="">Select Group</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="contactEmail" placeholder="Email address" />
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save Contact</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    loadGroups();
    loadContacts();
    setupForm();
});

function loadGroups(selectedGroup) {
    $.ajax({
        url: 'api/sms/groups.php',
        method: 'GET',
        dataType: 'json',
        success: function(resp) {
            if (resp.success && resp.data.groups) {
                var html = ['<option value="">Select Group</option>'];
                resp.data.groups.forEach(function(g) {
                    html.push('<option value="' + g.id + '">' + g.name + '</option>');
                });
                $('#contactGroup').html(html.join(''));
                if (selectedGroup) {
                    $('#contactGroup').val(selectedGroup);
                }
            }
        }
    });
}

function loadContacts() {
    var groupMap = {};
    $.ajax({
        url: 'api/sms/groups.php',
        method: 'GET',
        dataType: 'json',
        async: false,
        success: function(gr) {
            if (gr.success && gr.data.groups) {
                gr.data.groups.forEach(function(g) { groupMap[g.id] = g.name; });
            }
        }
    });

    $.ajax({
        url: 'api/sms/contacts.php',
        method: 'GET',
        dataType: 'json',
        success: function(resp) {
            if (resp.success && resp.data.contacts) {
                var html = resp.data.contacts.map(function(c) {
                    return '<tr>' +
                        '<td>' + c.name + '</td>' +
                        '<td>' + c.phone + '</td>' +
                        '<td>' + (groupMap[c.group_uid] || c.group_uid || '-') + '</td>' +
                        '<td>' + (c.email || '-') + '</td>' +
                        '<td><span class="badge bg-success">' + c.status + '</span></td>' +
                        '<td>' +
                        '<a href="javascript:void(0);" class="btn btn-sm btn-primary edit-contact" data-id="' + c.id + '"><i class="bx bx-edit"></i></a>' +
                        '<a href="javascript:void(0);" class="btn btn-sm btn-danger delete-contact" data-id="' + c.id + '"><i class="bx bx-trash"></i></a>' +
                        '</td>' +
                        '</tr>';
                }).join('');
                $('#contactsTableBody').html(html || '<tr><td colspan="6" class="text-center">No contacts found</td></tr>');
            }
        }
    });
}

function setupForm() {
    $('#contactForm').submit(function(e) {
        e.preventDefault();
        var id = $('#contactId').val();
        var data = {
            id: id,
            name: $('#contactName').val(),
            phone: $('#contactPhone').val(),
            group_uid: $('#contactGroup').val(),
            email: $('#contactEmail').val()
        };

        var method = id ? 'PUT' : 'POST';
        $.ajax({
            url: 'api/sms/contacts.php',
            method: method,
            contentType: 'application/json',
            data: JSON.stringify(data),
            dataType: 'json',
            success: function(resp) {
                if (resp.success) {
                    $('#addContactModal').modal('hide');
                    $('#contactForm')[0].reset();
                    $('#contactId').val('');
                    loadContacts();
                    alert('Contact saved successfully');
                } else {
                    alert('Error: ' + resp.message);
                }
            }
        });
    });

    $(document).on('click', '.edit-contact', function() {
        var id = $(this).data('id');
        $.ajax({
            url: 'api/sms/contacts.php?id=' + encodeURIComponent(id),
            method: 'GET',
            dataType: 'json',
            success: function(resp) {
                if (resp.success && resp.data.contacts && resp.data.contacts.length > 0) {
                    var c = resp.data.contacts[0];
                    $('#contactId').val(c.id);
                    $('#contactName').val(c.name);
                    $('#contactPhone').val(c.phone);
                    loadGroups(c.group_uid || '');
                    $('#contactEmail').val(c.email || '');
                    $('#addContactModal').modal('show');
                }
            }
        });
    });

    $(document).on('click', '.delete-contact', function() {
        var id = $(this).data('id');
        if (confirm('Are you sure you want to delete this contact?')) {
            $.ajax({
                url: 'api/sms/contacts.php',
                method: 'DELETE',
                contentType: 'application/json',
                data: JSON.stringify({id: id}),
                dataType: 'json',
                success: function(resp) {
                    if (resp.success) {
                        loadContacts();
                        alert('Contact deleted successfully');
                    } else {
                        alert('Error: ' + resp.message);
                    }
                }
            });
        }
    });

    $('#addContactModal').on('hidden.bs.modal', function() {
        $('#contactForm')[0].reset();
        $('#contactId').val('');
        loadGroups();
    });
}
</script>
