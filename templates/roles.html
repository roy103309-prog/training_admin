<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">User Roles</div>
        <nav aria-label="breadcrumb" class="mt-1">
            <ol class="breadcrumb mb-0 p-0"></ol>
    </nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> Add Role</button>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>ID</th><th>Role Name</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="4" class="text-center">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addEditModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 id="modalTitle">Add Role</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="itemId">
                <div class="mb-3"><label>Role Name *</label><input type="text" class="form-control" id="itemName" required></div>
                <div class="mb-3"><label>Status</label><select class="form-select" id="itemStatus"><option value="1">Active</option><option value="0">Inactive</option></select></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSave">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
window.Page = {
    init: function() {
        var self = this;
        self._loadData();
        $('#btnAdd').off('click.role').on('click.role', function(){ $('#modalTitle').text('Add Role'); $('input').val(''); $('#itemStatus').val('1'); $('#addEditModal').modal('show'); });
        $('#btnSave').off('click.role').on('click.role', function(){ self._save(); });
        $(document).off('click.role-edit').on('click.role-edit', '.btn-edit', function(){ self._edit($(this).data('id')); });
        $(document).off('click.role-perm').on('click.role-perm', '.btn-permission', function(){
            var roleId = $(this).data('id');
            var target = 'admin/user-permissions?role_id=' + roleId;
            if (window.HotelApp && window.HotelApp.navigate) {
                // SPA navigation: preserves sidebar/header/footer shell
                history.pushState({}, '', target);
                window.HotelApp.navigate('admin/user-permissions');
            } else {
                window.location.href = target;
            }
        });
        $(document).off('click.role-del').on('click.role-del', '.btn-delete', function(){ if(confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function() { $('#btnAdd').off('click.role'); $('#btnSave').off('click.role'); $(document).off('click.role-edit click.role-perm click.role-del'); },
    _loadData: function() {
        var self=this;
        $.ajax({url:'api/user/roles-list.php',
            success:function(r){if(r.success)self._renderTable(r.data.items);},
            error:function(){$('#tableBody').html('<tr><td colspan="4" class="text-danger text-center">Error</td></tr>');}});
    },
    _renderTable: function(items) {
        $('#tableBody').html(items.map(function(i){ return '<tr><td>'+i.id+'</td><td>'+i.name+'</td><td><span class="badge bg-'+(i.isactive?'success':'danger')+'">'+(i.isactive?'Active':'Inactive')+'</span></td><td><button class="btn btn-sm btn-primary btn-edit" data-id="'+i.id+'"><i class="bx bx-edit"></i></button> <button class="btn btn-sm btn-info btn-permission" data-id="'+i.id+'" title="Role Permissions"><i class="bx bx-shield"></i></button> <button class="btn btn-sm btn-danger btn-delete" data-id="'+i.id+'"><i class="bx bx-trash"></i></button></td></tr>'; }).join('')||'<tr><td colspan="4" class="text-center">No data</td></tr>');
    },
    _save: function() {
        var self=this,id=$('#itemId').val(),d={id:id||undefined,name:$('#itemName').val(),isactive:parseInt($('#itemStatus').val())};
        $.ajax({url:id?'api/user/roles-update.php':'api/user/roles-create.php',method:'POST',contentType:'application/json',data:JSON.stringify(d),
            success:function(r){if(r.success){$('#addEditModal').modal('hide');self._loadData();}if(window.Toast)Toast.info(r.message);else alert(r.message);},
            error:function(){if(window.Toast)Toast.info('Failed');else alert('Failed');}});
    },
    _edit: function(id) {
        var self=this;
        $.ajax({url:'api/user/roles-list.php',success:function(r){var i=r.data.items.find(function(x){return x.id==id;});if(i){$('#itemId').val(i.id);$('#itemName').val(i.name);$('#itemStatus').val(i.isactive);$('#modalTitle').text('Edit Role');$('#addEditModal').modal('show');}}});
    },
    _del: function(id) {
        var self=this;
        $.ajax({url:'api/user/roles-delete.php',method:'POST',contentType:'application/json',data:JSON.stringify({id:id}),
            success:function(r){if(r.success)self._loadData();if(window.Toast)Toast.info(r.message);else alert(r.message);},
            error:function(){if(window.Toast)Toast.info('Failed');else alert('Failed');}});
    }
};
</script>
