<div class="content">
    <div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
        <div class="d-flex flex-column">
            <div class="breadcrumb-title">Scheduled SMS</div>
            <nav aria-label="breadcrumb" class="mt-1">
                <ol class="breadcrumb mb-0 p-0"></ol>
            </nav>
        </div>
        <div class="ms-auto ms-md-0">
            <a href="admin/sms-campaigns" data-route class="btn btn-primary"><i class="bx bx-cog"></i> Manage Campaigns</a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Scheduled At</th>
                            <th>Contacts</th>
                            <th>Sent</th>
                            <th>Status</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="schedTableBody">
                        <tr><td colspan="6" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $.ajax({
        url: 'api/sms/scheduled.php', method: 'GET', dataType: 'json',
        success: function(resp) {
            if (!resp.success || !resp.data.campaigns) return;
            var html = resp.data.campaigns.map(function(c) {
                var cls = c.status === 'Scheduled' ? 'warning' : (c.status === 'Completed' ? 'success' : 'secondary');
                return '<tr>' +
                    '<td>' + c.name + '</td>' +
                    '<td>' + (c.scheduled_at || '-') + '</td>' +
                    '<td>' + c.total_contacts + '</td>' +
                    '<td>' + c.total_sent + '</td>' +
                    '<td><span class="badge bg-' + cls + '">' + c.status + '</span></td>' +
                    '<td><small>' + (c.created_at || '-') + '</small></td>' +
                    '</tr>';
            }).join('');
            $('#schedTableBody').html(html || '<tr><td colspan="6" class="text-center">No scheduled campaigns</td></tr>');
        }
    });
});
</script>
