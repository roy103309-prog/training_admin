<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Leave</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0"><button class="btn btn-sm btn-primary d-inline-flex align-items-center gap-1" id="btnAdd"><i class="bx bx-plus"></i> Add Leave</button></div>
</div>
<div class="card"><div class="card-body">
    <div class="table-responsive"><table class="table table-striped align-middle">
        <thead><tr><th>Employee</th><th>Role</th><th>Leave Type</th><th>From</th><th>To</th><th class="text-center">Days</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
    </table></div>
</div></div>

<div class="modal fade" id="lvModal"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 id="lvTitle">Add Leave</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="lvId">
        <div class="row g-2">
            <div class="col-md-6"><label class="form-label small mb-1">Employee *</label><select class="form-select form-select-sm" id="lvEmp"></select></div>
            <div class="col-md-6"><label class="form-label small mb-1">Leave Type</label><select class="form-select form-select-sm" id="lvType"><option value="">--</option></select></div>
            <div class="col-md-4"><label class="form-label small mb-1">From Date *</label><input type="date" class="form-control form-control-sm" id="lvFrom"></div>
            <div class="col-md-4"><label class="form-label small mb-1">To Date *</label><input type="date" class="form-control form-control-sm" id="lvTo"></div>
            <div class="col-md-4"><label class="form-label small mb-1">Status</label>
                <select class="form-select form-select-sm" id="lvStatus">
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
            <div class="col-12"><label class="form-label small mb-1">Reason</label><textarea class="form-control form-control-sm" id="lvReason" rows="2"></textarea></div>
        </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="lvSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    init: function () {
        var self = this;
        self._loadDropdowns();
        self._load();
        $('#btnAdd').off('click.lv').on('click.lv', function () {
            $('#lvId').val(''); $('#lvEmp').val(''); $('#lvType').val(''); $('#lvFrom').val(''); $('#lvTo').val('');
            $('#lvStatus').val('pending'); $('#lvReason').val('');
            $('#lvTitle').text('Add Leave'); $('#lvModal').modal('show');
        });
        $('#lvSave').off('click.lv').on('click.lv', function () { self._save(); });
        $(document).off('click.lv-edit').on('click.lv-edit', '.lv-edit', function () { self._edit($(this).data('id')); });
        $(document).off('click.lv-del').on('click.lv-del', '.lv-del', function () { if (confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function () { $('#btnAdd,#lvSave').off('.lv'); $(document).off('click.lv-edit click.lv-del'); },
    _loadDropdowns: function () {
        $.get('api/attendance/employees-list.php', function (r) {
            if (!r.success) return;
            $('#lvEmp').html('<option value="">-- Employee --</option>' + (r.data.items || []).map(function (e) {
                return '<option value="' + e.id + '">' + (e.employee_code || '') + ' - ' + e.name + '</option>';
            }).join(''));
        });
        $.get('api/attendance/leave-types-list.php', function (r) {
            if (!r.success) return;
            $('#lvType').html('<option value="">--</option>' + (r.data.items || []).filter(function (x) { return parseInt(x.isactive, 10) === 1; }).map(function (x) {
                return '<option value="' + x.id + '">' + x.name + '</option>';
            }).join(''));
        });
    },
    _fmtDate: function (v) { if (!v) return '-'; var d = new Date(v); return isNaN(d.getTime()) ? v : d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); },
    _badge: function (s) {
        var m = { pending:'bg-warning text-dark', approved:'bg-success', rejected:'bg-danger' };
        return '<span class="badge ' + (m[s] || 'bg-secondary') + '">' + s + '</span>';
    },
    _load: function () {
        var self = this;
        $.get('api/attendance/leaves-list.php', function (r) {
            if (!r.success) return;
            self._items = r.data.items;
            if (!r.data.items.length) { $('#tableBody').html('<tr><td colspan="8" class="text-center">No data</td></tr>'); return; }
            $('#tableBody').html(r.data.items.map(function (x) {
                return '<tr><td>' + x.emp_name + '</td><td>' + (x.role_name || '-') + '</td><td>' + (x.leave_type_name || '-') + '</td>' +
                       '<td>' + self._fmtDate(x.from_date) + '</td><td>' + self._fmtDate(x.to_date) + '</td>' +
                       '<td class="text-center">' + x.days + '</td><td>' + self._badge(x.status) + '</td>' +
                       '<td class="text-end"><button class="btn btn-sm btn-primary lv-edit" data-id="' + x.id + '"><i class="bx bx-edit"></i></button> ' +
                       '<button class="btn btn-sm btn-danger lv-del" data-id="' + x.id + '"><i class="bx bx-trash"></i></button></td></tr>';
            }).join(''));
        });
    },
    _save: function () {
        var self = this;
        var d = {
            id: parseInt($('#lvId').val(), 10) || 0,
            user_id: parseInt($('#lvEmp').val(), 10) || 0,
            leave_type_id: parseInt($('#lvType').val(), 10) || 0,
            from_date: $('#lvFrom').val(),
            to_date: $('#lvTo').val(),
            status: $('#lvStatus').val(),
            reason: $('#lvReason').val().trim()
        };
        if (!d.user_id || !d.from_date || !d.to_date) { if (window.Toast) Toast.warning('Employee and dates required'); return; }
        $.ajax({ url: 'api/attendance/leaves-save.php', method: 'POST', contentType: 'application/json', data: JSON.stringify(d) })
        .done(function (r) { if (r.success) { $('#lvModal').modal('hide'); self._load(); } if (window.Toast) Toast.info(r.message); else alert(r.message); });
    },
    _edit: function (id) {
        var x = (this._items || []).find(function (i) { return i.id == id; });
        if (!x) return;
        $('#lvId').val(x.id); $('#lvEmp').val(x.user_id); $('#lvType').val(x.leave_type_id || '');
        $('#lvFrom').val(x.from_date); $('#lvTo').val(x.to_date); $('#lvStatus').val(x.status); $('#lvReason').val(x.reason || '');
        $('#lvTitle').text('Edit Leave'); $('#lvModal').modal('show');
    },
    _del: function (id) {
        var self = this;
        $.ajax({ url: 'api/attendance/leaves-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function (r) { if (r.success) self._load(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
