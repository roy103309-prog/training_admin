<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Reviews</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0"><button class="btn btn-primary d-none" id="rvAdd"><i class="bx bx-plus"></i> Add Review</button></div>
</div>

<div class="card"><div class="card-body">
    <div class="row mb-3"><div class="col-md-4"><input class="form-control" id="rvSearch" placeholder="Search name, trade, country..."></div></div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Photo</th><th>Student</th><th>Trade / Country</th><th>Rating</th><th style="width:35%">Message</th><th>Sort</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div></div>

<div class="modal fade" id="rvModal"><div class="modal-dialog"><div class="modal-content">
<form id="rvForm" onsubmit="return false">
    <div class="modal-header"><h5 id="rvTitle">Add Review</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" name="id">
        <div class="mb-3"><label class="form-label">Student Name *</label><input class="form-control" name="student_name"></div>
        <div class="row">
            <div class="col-6 mb-3"><label class="form-label">Trade</label><input class="form-control" name="trade"></div>
            <div class="col-6 mb-3"><label class="form-label">Country</label><input class="form-control" name="country"></div>
        </div>
        <div class="mb-3"><label class="form-label">Message *</label><textarea class="form-control" rows="4" name="message"></textarea></div>
        <div class="row">
            <div class="col-4 mb-3"><label class="form-label">Rating</label><select class="form-select no-select2" name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
            <div class="col-4 mb-3"><label class="form-label">Sort</label><input type="number" class="form-control" name="sort_order" value="0"></div>
            <div class="col-4 mb-3 d-flex align-items-end"><div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="rvActive" checked><label class="form-check-label" for="rvActive">Active</label></div></div>
        </div>
        <div class="mb-2"><label class="form-label">Photo</label><input type="file" class="form-control" name="photo" accept="image/*"></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" name="remove_photo" value="1" id="rvRemove"><label class="form-check-label" for="rvRemove">Remove current photo</label></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" id="rvSave">Save</button></div>
</form>
</div></div></div>

<script>
window.Page = {
    _items: [], _timer: null,
    init: function() {
        var self = this, app = window.NL;
        self._canEdit = app.hasPermission('edit'); self._canDelete = app.hasPermission('delete');
        $('#rvAdd').toggleClass('d-none', !app.hasPermission('add'));
        self._load();
        $('#rvSearch').off('input.rv').on('input.rv', function(){ clearTimeout(self._timer); self._timer = setTimeout(function(){ self._render(); }, 200); });
        $('#rvAdd').off('click.rv').on('click.rv', function(){ self._open(null); });
        $('#rvSave').off('click.rv').on('click.rv', function(){ self._save(); });
        $('#tableBody').off('click.rv').on('click.rv', '.rv-edit', function(){ var id = $(this).data('id'); self._open(self._items.find(function(x){ return x.id == id; })); })
            .on('click.rv', '.rv-del', function(){ if (confirm('Delete this review?')) self._del($(this).data('id')); });
    },
    destroy: function() { clearTimeout(this._timer); $('#rvSearch,#rvAdd,#rvSave,#tableBody').off('.rv'); },
    _load: function() {
        var self = this;
        $.get('api/web-reviews-list.php', function(r){ if (r.success) { self._items = r.data.items; self._render(); } });
    },
    _render: function() {
        var self = this, q = ($('#rvSearch').val() || '').toLowerCase();
        $('#tableBody').html(self._items.filter(function(v){ return !q || (v.student_name + ' ' + v.trade + ' ' + v.country).toLowerCase().indexOf(q) !== -1; }).map(function(v){
            var photo = v.photo_url ? '<img src="' + NL.esc(NL.media(v.photo_url)) + '" width="40" height="40" class="rounded-circle" style="object-fit:cover">' : '<i class="bx bx-user-circle fs-3 text-muted"></i>';
            var act = (self._canEdit ? '<button class="btn btn-sm btn-primary rv-edit" data-id="' + v.id + '"><i class="bx bx-edit"></i></button> ' : '') +
                      (self._canDelete ? '<button class="btn btn-sm btn-danger rv-del" data-id="' + v.id + '"><i class="bx bx-trash"></i></button>' : '');
            return '<tr><td>' + photo + '</td><td>' + NL.esc(v.student_name) + '</td><td>' + NL.esc(v.trade) + '<div class="small text-muted">' + NL.esc(v.country) + '</div></td>' +
                '<td class="text-warning text-nowrap">' + '★'.repeat(v.rating) + '</td><td class="small">' + NL.esc(v.message.length > 140 ? v.message.slice(0, 140) + '…' : v.message) + '</td>' +
                '<td>' + v.sort_order + '</td><td><span class="badge bg-' + (v.is_active == 1 ? 'success' : 'secondary') + '">' + (v.is_active == 1 ? 'Active' : 'Hidden') + '</span></td>' +
                '<td class="text-end text-nowrap">' + act + '</td></tr>';
        }).join('') || '<tr><td colspan="8" class="text-center">No reviews</td></tr>');
    },
    _open: function(v) {
        var f = $('#rvForm')[0];
        f.reset();
        ['id', 'student_name', 'trade', 'country', 'message', 'rating', 'sort_order'].forEach(function(k){ f[k].value = v ? v[k] : (k === 'rating' ? 5 : (k === 'sort_order' ? 0 : '')); });
        $('#rvActive').prop('checked', v ? v.is_active == 1 : true);
        $('#rvTitle').text(v ? 'Edit Review' : 'Add Review'); $('#rvModal').modal('show');
    },
    _save: function() {
        var self = this, fd = new FormData($('#rvForm')[0]);
        fd.set('is_active', $('#rvActive').is(':checked') ? 1 : 0);
        $.ajax({ url: 'api/web-reviews-save.php', method: 'POST', data: fd, processData: false, contentType: false })
        .done(function(r){ if (r.success) { $('#rvModal').modal('hide'); self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/web-reviews-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) { self._load(); Toast.success(r.message); } else Toast.error(r.message); });
    }
};
</script>
