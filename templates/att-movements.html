<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Movement Register</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0"><button class="btn btn-sm btn-primary d-inline-flex align-items-center gap-1" id="btnAdd"><i class="bx bx-plus"></i> Add Movement</button></div>
</div>
<div class="card"><div class="card-body">
    <div class="table-responsive"><table class="table table-striped align-middle">
        <thead><tr><th>Employee</th><th>Role</th><th>From</th><th>To</th><th>In</th><th>Out</th><th class="text-center">Auto Present</th><th>Place</th><th class="text-end">Actions</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="9" class="text-center">Loading...</td></tr></tbody>
    </table></div>
</div></div>

<div class="modal fade" id="mvModal"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 id="mvTitle">Add Movement</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="mvId">
        <div class="row g-2 mb-2">
            <div class="col-md-6"><label class="form-label small mb-1">Employee *</label><select class="form-select form-select-sm" id="mvEmp"></select></div>
            <div class="col-md-3"><label class="form-label small mb-1">From Date *</label><input type="date" class="form-control form-control-sm" id="mvFrom"></div>
            <div class="col-md-3"><label class="form-label small mb-1">To Date *</label><input type="date" class="form-control form-control-sm" id="mvTo"></div>
            <div class="col-md-3"><label class="form-label small mb-1">In Time</label><input type="time" class="form-control form-control-sm" id="mvIn"></div>
            <div class="col-md-3"><label class="form-label small mb-1">Out Time</label><input type="time" class="form-control form-control-sm" id="mvOut"></div>
            <div class="col-md-3"><label class="form-label small mb-1">Auto Attendance</label>
                <select class="form-select form-select-sm" id="mvAuto">
                    <option value="1">Yes (mark present)</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="col-md-3"><label class="form-label small mb-1">Location / Place</label><input class="form-control form-control-sm" id="mvPlace"></div>
            <div class="col-12"><label class="form-label small mb-1">Purpose</label><textarea class="form-control form-control-sm" id="mvPurpose" rows="2"></textarea></div>
        </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="mvSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    init: function () {
        var self = this;
        self._loadEmps();
        self._load();
        $('#btnAdd').off('click.mv').on('click.mv', function () {
            $('#mvId').val(''); $('#mvEmp').val(''); $('#mvFrom').val(''); $('#mvTo').val('');
            $('#mvIn').val(''); $('#mvOut').val(''); $('#mvAuto').val('1'); $('#mvPlace').val(''); $('#mvPurpose').val('');
            $('#mvTitle').text('Add Movement'); $('#mvModal').modal('show');
        });
        $('#mvSave').off('click.mv').on('click.mv', function () { self._save(); });
        $(document).off('click.mv-edit').on('click.mv-edit', '.mv-edit', function () { self._edit($(this).data('id')); });
        $(document).off('click.mv-del').on('click.mv-del', '.mv-del', function () { if (confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function () { $('#btnAdd,#mvSave').off('.mv'); $(document).off('click.mv-edit click.mv-del'); },
    _loadEmps: function () {
        $.get('api/attendance/employees-list.php', function (r) {
            if (!r.success) return;
            $('#mvEmp').html('<option value="">-- Employee --</option>' + (r.data.items || []).map(function (e) {
                return '<option value="' + e.id + '">' + (e.employee_code || '') + ' - ' + e.name + '</option>';
            }).join(''));
        });
    },
    _fmtDate: function (v) { if (!v) return '-'; var d = new Date(v); return isNaN(d.getTime()) ? v : d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); },
    _t: function (v) { return v ? v.substring(0,5) : '-'; },
    _load: function () {
        var self = this;
        $.get('api/attendance/movements-list.php', function (r) {
            if (!r.success) return;
            self._items = r.data.items;
            if (!r.data.items.length) { $('#tableBody').html('<tr><td colspan="9" class="text-center">No data</td></tr>'); return; }
            $('#tableBody').html(r.data.items.map(function (x) {
                var auto = parseInt(x.auto_present, 10) ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>';
                return '<tr><td>' + x.emp_name + '</td><td>' + (x.role_name || '-') + '</td>' +
                       '<td>' + self._fmtDate(x.from_date) + '</td><td>' + self._fmtDate(x.to_date) + '</td>' +
                       '<td>' + self._t(x.in_time) + '</td><td>' + self._t(x.out_time) + '</td>' +
                       '<td class="text-center">' + auto + '</td><td>' + (x.place || '-') + '</td>' +
                       '<td class="text-end"><button class="btn btn-sm btn-primary mv-edit" data-id="' + x.id + '"><i class="bx bx-edit"></i></button> ' +
                       '<button class="btn btn-sm btn-danger mv-del" data-id="' + x.id + '"><i class="bx bx-trash"></i></button></td></tr>';
            }).join(''));
        });
    },
    _save: function () {
        var self = this;
        var d = {
            id: parseInt($('#mvId').val(), 10) || 0,
            user_id: parseInt($('#mvEmp').val(), 10) || 0,
            from_date: $('#mvFrom').val(),
            to_date: $('#mvTo').val(),
            in_time: $('#mvIn').val(),
            out_time: $('#mvOut').val(),
            auto_present: parseInt($('#mvAuto').val(), 10),
            place: $('#mvPlace').val().trim(),
            purpose: $('#mvPurpose').val().trim()
        };
        if (!d.user_id || !d.from_date || !d.to_date) { if (window.Toast) Toast.warning('Employee and dates required'); return; }
        $.ajax({ url: 'api/attendance/movements-save.php', method: 'POST', contentType: 'application/json', data: JSON.stringify(d) })
        .done(function (r) { if (r.success) { $('#mvModal').modal('hide'); self._load(); } if (window.Toast) Toast.info(r.message); else alert(r.message); });
    },
    _edit: function (id) {
        var x = (this._items || []).find(function (i) { return i.id == id; });
        if (!x) return;
        $('#mvId').val(x.id); $('#mvEmp').val(x.user_id); $('#mvFrom').val(x.from_date); $('#mvTo').val(x.to_date);
        $('#mvIn').val(x.in_time ? x.in_time.substring(0,5) : ''); $('#mvOut').val(x.out_time ? x.out_time.substring(0,5) : '');
        $('#mvAuto').val(String(x.auto_present)); $('#mvPlace').val(x.place || ''); $('#mvPurpose').val(x.purpose || '');
        $('#mvTitle').text('Edit Movement'); $('#mvModal').modal('show');
    },
    _del: function (id) {
        var self = this;
        $.ajax({ url: 'api/attendance/movements-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function (r) { if (r.success) self._load(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
