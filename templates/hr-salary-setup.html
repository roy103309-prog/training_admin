<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Basic Salary Setup</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-primary" id="btnAdd"><i class="bx bx-plus"></i> Add Setup</button>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>ID</th><th>Role</th><th>Grade</th><th>Salary Type</th><th class="text-end">Amount</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
    <div id="pagination" class="d-flex justify-content-center mt-3"></div>
</div></div>

<div class="modal fade" id="ssModal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 id="ssTitle">Add Salary Setup</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input type="hidden" id="ssId">
        <div class="mb-3"><label class="form-label">Role *</label><select class="form-select" id="ssRole"></select></div>
        <div class="mb-3"><label class="form-label">Grade *</label><select class="form-select" id="ssGrade"></select></div>
        <div class="mb-3"><label class="form-label">Salary Type *</label>
            <select class="form-select" id="ssType">
                <option value="monthly">Monthly</option>
                <option value="weekly">Weekly</option>
                <option value="daily">Daily</option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Amount *</label><input type="number" step="0.01" min="0" class="form-control" id="ssAmount"></div>
        <div class="form-check form-switch"><input type="checkbox" class="form-check-input" id="ssActive" checked><label class="form-check-label" for="ssActive">Active</label></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="ssSave">Save</button></div>
</div></div></div>

<script>
window.Page = {
    _page: 1,
    init: function() {
        var self = this;
        self._loadDropdowns();
        self._load();
        $('#btnAdd').off('click.ss').on('click.ss', function(){
            $('#ssId').val(''); $('#ssRole').val(''); $('#ssGrade').val(''); $('#ssType').val('monthly'); $('#ssAmount').val(''); $('#ssActive').prop('checked', true);
            $('#ssTitle').text('Add Salary Setup'); $('#ssModal').modal('show');
        });
        $('#ssSave').off('click.ss').on('click.ss', function(){ self._save(); });
        $(document).off('click.ss-edit').on('click.ss-edit', '.ss-edit', function(){ self._edit($(this).data('id')); });
        $(document).off('click.ss-del').on('click.ss-del',  '.ss-del',  function(){ if(confirm('Delete?')) self._del($(this).data('id')); });
    },
    destroy: function() {
        $('#btnAdd,#ssSave').off('.ss');
        $(document).off('click.ss-edit click.ss-del');
    },
    _loadDropdowns: function() {
        $.get('api/user/roles-list.php', function(r){
            if (!r.success) return;
            var opts = '<option value="">-- Role --</option>' + (r.data.items || []).map(function(x){ return '<option value="'+x.id+'">'+x.name+'</option>'; }).join('');
            $('#ssRole').html(opts);
        });
        $.get('api/hr/grades-list.php', { limit: 200 }, function(r){
            if (!r.success) return;
            var opts = '<option value="">-- Grade --</option>' + (r.data.items || []).filter(function(g){return parseInt(g.isactive,10)===1;}).map(function(g){ return '<option value="'+g.id+'">'+g.name+'</option>'; }).join('');
            $('#ssGrade').html(opts);
        });
    },
    _load: function() {
        var self = this;
        $.get('api/hr/salary-setup-list.php', { page: self._page }, function(r){
            if (!r.success) return;
            self._render(r.data.items);
            self._pag(r.data.pagination);
        });
    },
    _render: function(items) {
        if (!items.length) { $('#tableBody').html('<tr><td colspan="7" class="text-center">No setup</td></tr>'); return; }
        $('#tableBody').html(items.map(function(s){
            var badge = parseInt(s.isactive, 10) ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>';
            return '<tr><td>'+s.id+'</td><td>'+(s.role_name||'-')+'</td><td>'+(s.grade_name||'-')+'</td><td>'+s.salary_type+'</td>' +
                   '<td class="text-end">৳'+parseFloat(s.amount).toFixed(2)+'</td><td>'+badge+'</td>' +
                   '<td class="text-end"><button class="btn btn-sm btn-primary ss-edit" data-id="'+s.id+'"><i class="bx bx-edit"></i></button> ' +
                   '<button class="btn btn-sm btn-danger ss-del" data-id="'+s.id+'"><i class="bx bx-trash"></i></button></td></tr>';
        }).join(''));
    },
    _pag: function(p) {
        var self = this, h = '';
        for (var i = 1; i <= p.pages; i++) h += '<button class="btn btn-sm '+(i===self._page?'btn-primary':'btn-outline-primary')+' mx-1 pg" data-page="'+i+'">'+i+'</button>';
        $('#pagination').html(h).off('click.ss-pg').on('click.ss-pg', '.pg', function(){ self._page = parseInt($(this).data('page'),10); self._load(); });
    },
    _save: function() {
        var self = this, id = $('#ssId').val();
        var d = {
            id: id || undefined,
            role_id:  parseInt($('#ssRole').val(),10)  || 0,
            grade_id: parseInt($('#ssGrade').val(),10) || 0,
            salary_type: $('#ssType').val(),
            amount: parseFloat($('#ssAmount').val()) || 0,
            isactive: $('#ssActive').is(':checked') ? 1 : 0
        };
        $.ajax({ url: id ? 'api/hr/salary-setup-update.php' : 'api/hr/salary-setup-create.php', method:'POST', contentType:'application/json', data: JSON.stringify(d) })
        .done(function(r){ if (r.success) { $('#ssModal').modal('hide'); self._load(); } if (window.Toast) Toast.info(r.message); else alert(r.message); });
    },
    _edit: function(id) {
        $.get('api/hr/salary-setup-list.php', { limit: 200 }, function(r){
            var s = (r.data.items || []).find(function(x){ return x.id == id; });
            if (!s) return;
            $('#ssId').val(s.id); $('#ssRole').val(s.role_id); $('#ssGrade').val(s.grade_id);
            $('#ssType').val(s.salary_type); $('#ssAmount').val(s.amount);
            $('#ssActive').prop('checked', parseInt(s.isactive,10) === 1);
            $('#ssTitle').text('Edit Salary Setup'); $('#ssModal').modal('show');
        });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/hr/salary-setup-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) self._load(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
