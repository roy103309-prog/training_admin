<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Student Due Report</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <button class="btn btn-outline-secondary" id="rdPrint"><i class="bx bx-printer"></i> Print</button>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="row g-2 mb-3">
        <div class="col-md-3"><select class="form-select no-select2" id="rdStatus"><option value="active">Active students</option><option value="all">All status</option><option value="completed">Completed</option><option value="inactive">Inactive</option><option value="dropped">Dropped</option></select></div>
        <div class="col-md-4"><select class="form-select" id="rdCourse"><option value="all">All courses</option></select></div>
        <div class="col-md-3"><div class="form-check form-switch mt-2"><input type="checkbox" class="form-check-input" id="rdOnlyDue" checked><label class="form-check-label" for="rdOnlyDue">Only students with due</label></div></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" id="rdLoad"><i class="bx bx-search"></i> Show</button></div>
    </div>
    <div id="rdArea">
        <h5 class="text-center mb-1" id="rdTitle">Student Due Report</h5>
        <div class="text-center small text-muted mb-3" id="rdSub"></div>
        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead><tr><th>#</th><th>Student ID</th><th>Name</th><th>Phone</th><th>Course</th><th>Admission</th><th class="text-end">Fee</th><th class="text-end">Paid</th><th class="text-end">Due</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="9" class="text-center">Click Show</td></tr></tbody>
                <tfoot id="rdFoot"></tfoot>
            </table>
        </div>
    </div>
</div></div>

<script>
window.Page = {
    init: function() {
        var self = this;
        $.get('api/student-courses-list.php', function(r){
            if (!r.success) return;
            var names = {}; r.data.items.forEach(function(c){ names[c.name] = 1; });
            $('#rdCourse').html('<option value="all">All courses</option>' + Object.keys(names).map(function(n){ return '<option value="' + NL.esc(n) + '">' + NL.esc(n) + '</option>'; }).join(''));
        });
        $('#rdLoad').off('click.rd').on('click.rd', function(){ self._load(); });
        $('#rdPrint').off('click.rd').on('click.rd', function(){
            var w = window.open('', '_blank');
            if (!w) return;
            w.document.write('<html><head><title>Student Due Report</title><link rel="stylesheet" href="' + location.origin + APP_PATHS.ROOT + '/assets/css/bootstrap.min.css"></head><body class="p-3">' + $('#rdArea').html() + '</body></html>');
            w.document.close(); setTimeout(function(){ w.print(); }, 400);
        });
        self._load();
    },
    destroy: function() { $('#rdLoad,#rdPrint').off('.rd'); },
    _load: function() {
        $.get('api/student-report-due.php', { status: $('#rdStatus').val(), course: $('#rdCourse').val(), only_due: $('#rdOnlyDue').is(':checked') ? 1 : 0 }, function(r){
            if (!r.success) return;
            var name = NL.instituteName();
            $('#rdTitle').text((name ? name + ' — ' : '') + 'Student Due Report');
            $('#rdSub').text('Generated ' + new Date().toLocaleString() + ' · ' + r.data.items.length + ' student(s)');
            $('#tableBody').html(r.data.items.map(function(s, i){
                return '<tr><td>' + (i + 1) + '</td><td>' + NL.esc(s.student_id) + '</td><td>' + NL.esc(s.name) + '</td><td>' + NL.esc(s.phone_number || '') + '</td>' +
                    '<td>' + NL.esc(s.course_name) + '</td><td>' + NL.esc(s.admission_date) + '</td><td class="text-end">' + Number(s.course_fee).toLocaleString() + '</td>' +
                    '<td class="text-end">' + Number(s.paid_amount).toLocaleString() + '</td><td class="text-end fw-semibold">' + Number(s.due_amount).toLocaleString() + '</td></tr>';
            }).join('') || '<tr><td colspan="9" class="text-center">No students</td></tr>');
            var t = r.data.totals;
            $('#rdFoot').html('<tr class="fw-bold"><td colspan="6" class="text-end">Total</td><td class="text-end">' + Number(t.fee).toLocaleString() + '</td><td class="text-end">' + Number(t.paid).toLocaleString() + '</td><td class="text-end">' + Number(t.due).toLocaleString() + '</td></tr>');
        });
    }
};
</script>
