<div class="page-breadcrumb mb-3 d-flex justify-content-between flex-column flex-md-row">
    <div class="d-flex flex-column">
        <div class="breadcrumb-title">Employee List</div>
        <nav aria-label="breadcrumb" class="mt-1"><ol class="breadcrumb mb-0 p-0"></ol></nav>
    </div>
    <div class="ms-auto ms-md-0">
        <a href="admin/employee-new" data-route class="btn btn-primary"><i class="bx bx-plus"></i> Add Employee</a>
    </div>
</div>

<div class="card"><div class="card-body">
    <div class="row mb-3">
        <div class="col-md-4"><input type="text" class="form-control" id="searchInput" placeholder="Search by name / mobile / email / code..."></div>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead><tr><th>Code</th><th>Name</th><th>Mobile</th><th>Email</th><th>Role</th><th>Grade</th><th>Salary</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="9" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
    <div id="pagination" class="d-flex justify-content-center mt-3"></div>
</div></div>

<script>
window.Page = {
    _page: 1, _search: '', _timer: null,
    init: function() {
        var self = this;
        self._load();
        $('#searchInput').off('input.emp').on('input.emp', function(){
            clearTimeout(self._timer);
            self._timer = setTimeout(function(){ self._search = $('#searchInput').val(); self._page = 1; self._load(); }, 300);
        });
        $(document).off('click.emp-del').on('click.emp-del', '.emp-del', function(){
            var id = $(this).data('id');
            if (confirm('Remove this employee?')) self._del(id);
        });
    },
    destroy: function() {
        clearTimeout(this._timer);
        $('#searchInput').off('.emp');
        $(document).off('click.emp-del');
    },
    _load: function() {
        var self = this;
        $.get('api/hr/employees-list.php', { page: self._page, search: self._search }, function(r){
            if (!r.success) return;
            self._render(r.data.items);
            self._pag(r.data.pagination);
        });
    },
    _render: function(items) {
        if (!items.length) { $('#tableBody').html('<tr><td colspan="9" class="text-center">No employees</td></tr>'); return; }
        $('#tableBody').html(items.map(function(u){
            var stat = parseInt(u.isactive,10) ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>';
            var sal  = u.basic_salary ? ('৳' + parseFloat(u.basic_salary).toFixed(2) + ' / ' + (u.salary_type||'-')) : '-';
            return '<tr><td>'+(u.employee_code||'-')+'</td><td>'+u.name+'</td><td>'+u.mobile+'</td><td>'+(u.email||'-')+'</td>' +
                   '<td>'+(u.role_name||'-')+'</td><td>'+(u.grade_name||'-')+'</td><td>'+sal+'</td><td>'+stat+'</td>' +
                   '<td class="text-end"><button class="btn btn-sm btn-danger emp-del" data-id="'+u.id+'"><i class="bx bx-trash"></i></button></td></tr>';
        }).join(''));
    },
    _pag: function(p) {
        var self = this, h = '';
        for (var i = 1; i <= p.pages; i++) h += '<button class="btn btn-sm '+(i===self._page?'btn-primary':'btn-outline-primary')+' mx-1 pg" data-page="'+i+'">'+i+'</button>';
        $('#pagination').html(h).off('click.emp-pg').on('click.emp-pg', '.pg', function(){ self._page = parseInt($(this).data('page'),10); self._load(); });
    },
    _del: function(id) {
        var self = this;
        $.ajax({ url: 'api/hr/employees-delete.php', method: 'POST', contentType: 'application/json', data: JSON.stringify({ id: id }) })
        .done(function(r){ if (r.success) self._load(); if (window.Toast) Toast.info(r.message); else alert(r.message); });
    }
};
</script>
