    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        (function() {
            var path = window.location.pathname || '/';
            var lower = path.toLowerCase();
            var markers = ['/admin/', '/admin', '/app.html', '/app/', '/app', '/login/', '/login', '/index.html'];
            var cutIndex = -1;

            for (var i = 0; i < markers.length; i++) {
                var idx = lower.indexOf(markers[i]);
                if (idx !== -1 && (cutIndex === -1 || idx < cutIndex)) {
                    cutIndex = idx;
                }
            }

            var root = (cutIndex >= 0) ? path.slice(0, cutIndex) : path.replace(/\/[^\/]*$/, '');
            root = root.replace(/\/+$/, '');

            var base = document.createElement('base');
            base.setAttribute('href', (root ? root : '') + '/');
            document.head.appendChild(base);

            // Pre-apply theme before stylesheets load — prevents light-mode flash
            try {
                var t = localStorage.getItem('theme_style') || '';
                var root = document.documentElement;
                if (t === 'dark-theme') {
                    root.classList.add('dark-theme');
                    root.setAttribute('data-bs-theme', 'dark');
                    var DV = {
                        '--ui-header-bg':     '#12181a',
                        '--ui-header-border': 'rgba(237,237,237,0.12)',
                        '--ui-header-text':   '#e4e5e6',
                        '--ui-sidebar-bg':    '#0f1417',
                        '--ui-sidebar-text':  '#c7c9cc',
                        '--ui-sidebar-submenu-bg': '#12181a',
                        '--bs-body-bg':       '#070d0e',
                        '--bs-body-color':    '#e4e5e6'
                    };
                    Object.keys(DV).forEach(function (k) { root.style.setProperty(k, DV[k], 'important'); });
                } else {
                    root.setAttribute('data-bs-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>
